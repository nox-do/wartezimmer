name: Publish website to GitHub Pages

# Start manually while the website is being prepared.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install validation dependencies
        run: npm ci --ignore-scripts
      - name: Check website styles, scripts and build regressions
        run: |
          npm run lint:website
          node --test scripts/build-pages.test.mjs
      - name: Validate publication details and assemble website
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
