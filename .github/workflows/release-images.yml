name: Release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.4.2, without v prefix)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-release-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-docker-action@v5
        with:
          version: latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="$INPUT_VERSION"
          fi
          if [[ ! "$release_version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

      - name: Build and pack release images
        env:
          WARTEZIMMER_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: npm run release:images

      - name: Pack update archives from the same images
        env:
          WARTEZIMMER_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: npm run release:pfupdate:current

      - name: Check shipped Node runtimes on both architectures
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          for arch in amd64 arm64; do
            for service in app sandbox; do
              docker run --rm --network none --platform "linux/$arch" \
                --entrypoint node -e EXPECTED_VERSION="$RELEASE_VERSION" \
                "wartezimmer/$service:$RELEASE_VERSION-$arch" -e '
                  const assert = require("node:assert/strict");
                  const zlib = require("node:zlib");
                  assert.equal(process.version, "v22.23.4");
                  assert.equal(require("./package.json").version, process.env.EXPECTED_VERSION);
                  assert.equal(zlib.brotliDecompressSync(zlib.brotliCompressSync(Buffer.from("smoke"))).toString(), "smoke");
                  const db = new (require("node:sqlite").DatabaseSync)(":memory:");
                  assert.equal(db.prepare("SELECT 42 AS value").get().value, 42);
                  db.close();
                  console.log(process.arch, process.version, process.env.EXPECTED_VERSION, "SQLite/Brotli OK");
                '
            done
          done

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: wartezimmer-release-${{ steps.version.outputs.value }}
          path: dist/releases/${{ steps.version.outputs.value }}/
          retention-days: 90
