name: Release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.4.2, without v prefix)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-release-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-docker-action@v5
        with:
          version: latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="$INPUT_VERSION"
          fi
          if [[ ! "$release_version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

      - name: Build and pack release images
        env:
          WARTEZIMMER_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: npm run release:images

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: wartezimmer-release-${{ steps.version.outputs.value }}
          path: dist/releases/${{ steps.version.outputs.value }}/
          retention-days: 90
