# Local TLS lab only. Not for production.
# API is HTTP (tls = "none") so host + compose network can share a non-TLS URL later (AP3).

[general]
listen = "0.0.0.0:53"
protocol = "both"
domain = "auth.acme.tls.lab"
nsname = "auth.acme.tls.lab"
nsadmin = "admin.auth.acme.tls.lab"
records = [
    "auth.acme.tls.lab. A 127.0.0.1",
    "auth.acme.tls.lab. NS auth.acme.tls.lab.",
]
debug = false

[database]
engine = "sqlite3"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "0.0.0.0"
disable_registration = false
port = "80"
tls = "none"
corsorigins = [
    "*"
]
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
