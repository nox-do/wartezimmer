<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allgemeinmedizin Erstanamnese</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
        line-height: 1.35;
      }
      h1,
      h2 {
        margin-bottom: 8px;
      }
      section {
        margin-bottom: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px;
      }
      .row {
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input[type='text'],
      input[type='email'],
      input[type='date'],
      input[type='number'],
      textarea {
        width: 100%;
        max-width: 720px;
        box-sizing: border-box;
        padding: 8px;
      }
      .checkbox label {
        font-weight: 400;
      }
      small {
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Allgemeinmedizinische Erstanamnese</h1>
    <p><small>Vorlage v1 für den Patienten-Erstkontakt in der Allgemeinmedizin.</small></p>

    <form>
      <section>
        <h2>Stammdaten</h2>
        <div class="row">
          <label for="fullName">Vollständiger Name</label>
          <input id="fullName" name="fullName" type="text" maxlength="160" required />
        </div>
        <div class="row">
          <label for="birthDate">Geburtsdatum</label>
          <input id="birthDate" name="birthDate" type="date" required />
        </div>
        <div class="row">
          <label for="contactPhone">Telefonnummer</label>
          <input id="contactPhone" name="contactPhone" type="text" maxlength="40" />
        </div>
        <div class="row">
          <label for="contactEmail">E-Mail</label>
          <input id="contactEmail" name="contactEmail" type="email" maxlength="160" />
        </div>
      </section>

      <section>
        <h2>Aktuelles Anliegen</h2>
        <div class="row">
          <label for="mainConcern">Aktuelle Hauptbeschwerde</label>
          <textarea
            id="mainConcern"
            name="mainConcern"
            rows="4"
            maxlength="2000"
            required
          ></textarea>
        </div>
        <div class="row">
          <label for="symptomSince">Seit wann bestehen die Beschwerden?</label>
          <input id="symptomSince" name="symptomSince" type="text" maxlength="200" />
        </div>
        <div class="row">
          <label for="painScale">Schmerzstärke (0–10)</label>
          <input id="painScale" name="painScale" type="number" min="0" max="10" step="1" />
        </div>
      </section>

      <section>
        <h2>Medizinische Vorgeschichte</h2>
        <div class="row">
          <label for="knownDiagnoses">Bekannte Vorerkrankungen</label>
          <textarea id="knownDiagnoses" name="knownDiagnoses" rows="3" maxlength="2000"></textarea>
        </div>
        <div class="row">
          <label for="pastOperations">Operationen / Krankenhausaufenthalte</label>
          <textarea id="pastOperations" name="pastOperations" rows="3" maxlength="2000"></textarea>
        </div>
        <div class="row">
          <label for="currentMedication">Aktuelle Medikation inkl. Supplements</label>
          <textarea
            id="currentMedication"
            name="currentMedication"
            rows="3"
            maxlength="2000"
          ></textarea>
        </div>
      </section>

      <section>
        <h2>Allergien und Familie</h2>
        <div class="row">
          <label for="knownAllergies">Allergien / Unverträglichkeiten</label>
          <textarea id="knownAllergies" name="knownAllergies" rows="3" maxlength="1500"></textarea>
        </div>
        <div class="row">
          <label for="allergyReactionNotes">Allergische Reaktionen (falls bekannt)</label>
          <textarea
            id="allergyReactionNotes"
            name="allergyReactionNotes"
            rows="2"
            maxlength="1000"
          ></textarea>
        </div>
        <div class="row checkbox">
          <label
            ><input name="familyHistoryCardio" type="checkbox" /> Familie:
            Herzinfarkt/Schlaganfall</label
          >
          <label><input name="familyHistoryDiabetes" type="checkbox" /> Familie: Diabetes</label>
          <label
            ><input name="familyHistoryCancer" type="checkbox" /> Familie: Krebserkrankungen</label
          >
        </div>
      </section>

      <section>
        <h2>Lebensstil und vegetative Anamnese</h2>
        <div class="row checkbox">
          <label><input name="smoker" type="checkbox" /> Rauchen</label>
        </div>
        <div class="row">
          <label for="cigarettesPerDay">Zigaretten pro Tag</label>
          <input id="cigarettesPerDay" name="cigarettesPerDay" type="number" min="0" step="1" />
        </div>
        <div class="row">
          <label for="alcoholPerWeek">Alkohol pro Woche (freie Angabe)</label>
          <input id="alcoholPerWeek" name="alcoholPerWeek" type="text" maxlength="120" />
        </div>
        <div class="row checkbox">
          <label><input name="substanceUse" type="checkbox" /> Weitere Suchtmittel</label>
          <label
            ><input name="digestiveOrUrinaryIssues" type="checkbox" /> Probleme mit
            Verdauung/Wasserlassen</label
          >
        </div>
        <div class="row">
          <label for="sleepQuality">Schlaf (frei beschreiben)</label>
          <textarea id="sleepQuality" name="sleepQuality" rows="2" maxlength="500"></textarea>
        </div>
      </section>

      <section>
        <h2>Weitere Angaben</h2>
        <div class="row">
          <label for="mentalHealthHistory">Psychische/neurologische Vorerkrankungen</label>
          <textarea
            id="mentalHealthHistory"
            name="mentalHealthHistory"
            rows="2"
            maxlength="1500"
          ></textarea>
        </div>
        <div class="row">
          <label for="heightCm">Körpergröße (cm)</label>
          <input id="heightCm" name="heightCm" type="number" min="50" max="260" step="1" />
        </div>
        <div class="row">
          <label for="weightKg">Gewicht (kg)</label>
          <input id="weightKg" name="weightKg" type="number" min="1" max="500" step="0.1" />
        </div>
        <div class="row checkbox">
          <label><input name="pregnant" type="checkbox" /> Schwangerschaft</label>
        </div>
        <div class="row">
          <label for="socialSituation">Soziale Situation / Beruf</label>
          <textarea
            id="socialSituation"
            name="socialSituation"
            rows="2"
            maxlength="1000"
          ></textarea>
        </div>
        <div class="row">
          <label for="careLevelOrSupportNeeds">Pflegegrad / Unterstützungsbedarf</label>
          <input
            id="careLevelOrSupportNeeds"
            name="careLevelOrSupportNeeds"
            type="text"
            maxlength="500"
          />
        </div>
        <div class="row">
          <label for="vaccinationOrInfectionNotes">Impfstatus / relevante Infektionen</label>
          <textarea
            id="vaccinationOrInfectionNotes"
            name="vaccinationOrInfectionNotes"
            rows="2"
            maxlength="1000"
          ></textarea>
        </div>
        <div class="row">
          <label for="patientGoals">Was ist Ihnen für die Behandlung wichtig?</label>
          <textarea id="patientGoals" name="patientGoals" rows="2" maxlength="1000"></textarea>
        </div>
      </section>

      <section>
        <h2>Einwilligung</h2>
        <div class="row checkbox">
          <label
            ><input name="consentDataProcessing" type="checkbox" required /> Einverständnis zur
            Datenverarbeitung</label
          >
        </div>
      </section>
    </form>
  </body>
</html>
