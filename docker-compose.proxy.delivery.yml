# Optional overlay: HTTP reverse proxy on port 80 (stock Caddy, delivery images).
# Usage:
#   docker compose -f docker-compose.delivery.yml -f docker-compose.proxy.delivery.yml up -d
#
# HTTP base. LAN-TLS adds docker-compose.proxy-tls.delivery.yml only while TLS is prepared/active.

x-docker-logging: &docker-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

services:
  proxy:
    logging: *docker-logging
    image: ${PRAXIS_FLOW_PROXY_IMAGE:-caddy:2.11.4}
    # Caddy is supplied by a verified Praxis Flow release; customer systems never pull it implicitly.
    pull_policy: never
    container_name: praxis-flow-proxy
    restart: unless-stopped
    environment:
      PROXY_MODE: ${PROXY_MODE:-http}
      PROXY_HTTP_PORT: ${PROXY_HTTP_PORT:-80}
      PROXY_HTTPS_PORT: ${PROXY_HTTPS_PORT:-443}
    ports:
      - '${PROXY_HTTP_PORT:-80}:80'
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Use the port that matches the active proxy mode. In TLS mode, :80 is a redirect endpoint,
      # not the real app-facing health signal.
      test:
        - CMD-SHELL
        - |
          if [ "${PROXY_MODE:-http}" = "tls-managed" ] || [ "${PROXY_MODE:-http}" = "tls-custom" ]; then
            wget -qO- --no-check-certificate "https://127.0.0.1:443/__praxis-flow/health" >/dev/null 2>&1
          else
            wget -qO- "http://127.0.0.1:80/" >/dev/null 2>&1
          fi
      interval: 10s
      timeout: 3s
      retries: 5
