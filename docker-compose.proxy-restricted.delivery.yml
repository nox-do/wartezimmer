# Delivery variant of the opt-in restricted-network publish.
# Layer after docker-compose.proxy.delivery.yml and docker-compose.proxy-tls.delivery.yml.
# External clients still use HTTPS port 443; port 444 is container-internal only.

services:
  proxy:
    ports:
      - '${SETUP_RESTRICTED_APP_IP:?SETUP_RESTRICTED_APP_IP is required}:443:444'
