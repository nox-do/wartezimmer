openapi: 3.1.0
info:
  title: Praxis Flow Queue API
  version: 0.4.0,
security:
  - mfaSessionCookie: []
  - tvDeviceSessionCookie: []
  - roomPanelSessionCookie: []
components:
  securitySchemes:
    mfaSessionCookie:
      type: apiKey
      in: cookie
      name: pf_mfa_session
    tvDeviceSessionCookie:
      type: apiKey
      in: cookie
      name: pf_tv_device_session
    roomPanelSessionCookie:
      type: apiKey
      in: cookie
      name: pf_room_panel_session
  schemas:
    QueueItem:
      type: object
      additionalProperties: false
      required:
        - visitId
        - laneCode
        - number
        - topicId
        - status
        - arrivedAt
        - waitMs
        - documentCount
        - hasMobilePhone
        - needsAssistance
      properties:
        visitId:
          type: string
          example: '20260530-A-001'
        laneCode:
          type: string
        number:
          type: integer
        topicId:
          type: string
        topicLabel:
          type: string
        destinationRoomId:
          type: string
          nullable: true
          description: Room snapshot from check-in (patient wayfinding / default call target).
        destinationRoomLabel:
          type: string
          nullable: true
        status:
          $ref: './common.yaml#/components/schemas/QueueStatus'
        roomId:
          type: string
          nullable: true
        roomLabel:
          type: string
          nullable: true
        journeyStepCompletedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Core treatment start (`arrived` → `in_progress`). Null while status is in_room
            means MFA should offer Starten before Entlassen/Weiter.
        arrivedAt:
          type: string
          format: date-time
        waitMs:
          type: integer
        documentCount:
          type: integer
        hasMobilePhone:
          type: boolean
        checkinPhone:
          type: string
          nullable: true
          description: Terminal check-in phone (staff queue only, not on TV)
        callbackPhone:
          type: string
          nullable: true
          description: Phone captured for absence/recall SMS (staff queue only)
        identityRef:
          type: string
          nullable: true
          description: Display name for MFA (CSV/eGK lookup or manual entry; staff queue only, not on TV; cleared on day reset)
        returnUntil:
          type: string
          format: date-time
          nullable: true
        recallNotifyErrorCode:
          type: string
          nullable: true
          description: Set when recall SMS/WhatsApp failed; enables MFA retry (staff queue only)
        recallNotifySent:
          type: boolean
          description: True when recall SMS/WhatsApp was successfully sent for the current return window (staff queue only)
        triageLevel:
          type: string
          nullable: true
          enum:
            - red
            - yellow
            - green
          description: MFA-only visual marker (staff triage); not shown on TV
        needsAssistance:
          type: boolean
          description: Patient requested help at terminal before topic check-in (MFA marker only)
        movementMode:
          type: string
          nullable: true
          enum:
            - call
            - self_go
            - pickup
          description: >-
            Visit movement mode. MFA shows Aufrufen only for waiting + call;
            directed/self_go and pickup stay visible without Call.
    TerminalAssistPendingItem:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - deviceLabel
        - pressedAt
        - expiresAt
        - remainingMs
      properties:
        deviceId:
          type: string
        deviceLabel:
          type: string
        pressedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        remainingMs:
          type: integer
          minimum: 0
    QueueTriageResponse:
      type: object
      additionalProperties: false
      required:
        - resultType
        - visitId
        - triageLevel
        - updatedAt
      properties:
        resultType:
          type: string
          const: triage
        visitId:
          type: string
        triageLevel:
          type: string
          nullable: true
          enum:
            - red
            - yellow
            - green
        updatedAt:
          type: string
          format: date-time
    QueueMessageDispatch:
      type: object
      additionalProperties: false
      required:
        - provider
        - attempted
        - sent
      properties:
        provider:
          type: string
        attempted:
          type: boolean
        sent:
          type: boolean
        messageId:
          type: string
        errorCode:
          type: string
        fallbackFrom:
          type: string
          description: Set when WhatsApp was attempted first and SMS completed delivery.
    QueueRecallRetryNotifyResponse:
      type: object
      additionalProperties: false
      required:
        - resultType
        - visitId
        - returnUntil
        - recallNotifyErrorCode
        - smsDispatch
      properties:
        resultType:
          type: string
          const: recall_notify_retry
        visitId:
          type: string
        returnUntil:
          type: string
          format: date-time
        recallNotifyErrorCode:
          type: string
          nullable: true
        smsDispatch:
          $ref: '#/components/schemas/QueueMessageDispatch'
    QueueCallbackPhoneResponse:
      type: object
      additionalProperties: false
      required:
        - visitId
        - callbackPhone
        - updatedAt
      properties:
        visitId:
          type: string
        callbackPhone:
          type: string
        updatedAt:
          type: string
          format: date-time
    QueueCallbackPhoneClearResponse:
      type: object
      additionalProperties: false
      required:
        - visitId
        - updatedAt
      properties:
        visitId:
          type: string
        updatedAt:
          type: string
          format: date-time
    QueueIdentityRefResponse:
      type: object
      additionalProperties: false
      required:
        - visitId
        - identityRef
        - updatedAt
      properties:
        visitId:
          type: string
        identityRef:
          type: string
        updatedAt:
          type: string
          format: date-time
    QueueSupersedeResponse:
      type: object
      additionalProperties: false
      required:
        - resultType
        - supersededVisitId
        - visitId
        - laneCode
        - number
        - topicId
        - topicLabel
        - checkedInAt
        - documentsRebound
      properties:
        resultType:
          type: string
          const: supersede
        supersededVisitId:
          type: string
        visitId:
          type: string
        laneCode:
          type: string
        number:
          type: integer
          minimum: 1
        topicId:
          type: string
        topicLabel:
          type: string
        destinationRoomLabel:
          type: string
          nullable: true
        checkedInAt:
          type: string
          format: date-time
        documentsRebound:
          type: integer
          minimum: 0
    QueueListMfaResponse:
      type: object
      additionalProperties: false
      required:
        - view
        - revision
        - items
        - assistPending
        - checkinLocked
        - serverTime
      properties:
        view:
          type: string
          const: mfa
        revision:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'
        assistPending:
          type: array
          items:
            $ref: '#/components/schemas/TerminalAssistPendingItem'
        checkinLocked:
          type: boolean
        serverTime:
          type: string
          format: date-time
    QueueTvItem:
      type: object
      additionalProperties: false
      required:
        - laneCode
        - number
        - status
        - roomLabel
      properties:
        laneCode:
          type: string
        number:
          type: integer
        status:
          $ref: './common.yaml#/components/schemas/QueueStatus'
        roomLabel:
          type: string
          nullable: true
          description: >-
            Assigned call room, or wayfinding target for directed/self_go and pickup
            (TV "Bitte weiter zu" / pickup copy).
        movementMode:
          type: string
          nullable: true
          enum:
            - call
            - self_go
            - pickup
          description: >-
            Visit movement mode. TV uses pickup (+ waiting) for "Sie werden abgeholt"
            and directed + self_go for wayfinding.
    QueueListTvResponse:
      type: object
      additionalProperties: false
      required:
        - view
        - revision
        - items
        - checkinLocked
        - serverTime
      properties:
        view:
          type: string
          const: tv
        revision:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueTvItem'
        checkinLocked:
          type: boolean
        serverTime:
          type: string
          format: date-time
    RoomPanelItemActions:
      type: object
      additionalProperties: false
      properties:
        canCall:
          type: boolean
        canArrive:
          type: boolean
        canCheckOut:
          type: boolean
    RoomPanelCapabilities:
      type: object
      additionalProperties: false
      required:
        - requiresPin
        - canCheckIn
        - canCheckOut
        - mayShowPatientNames
        - canCall
        - callAnnouncementReachable
      properties:
        requiresPin:
          type: boolean
        canCheckIn:
          type: boolean
        canCheckOut:
          type: boolean
        mayShowPatientNames:
          type: boolean
        canCall:
          type: boolean
        callAnnouncementReachable:
          type: boolean
          description: WZ-TV presence for call announcements; when false and canCall is true, UI should disable call actions.
    RoomPanelItem:
      type: object
      additionalProperties: false
      required:
        - visitId
        - laneCode
        - number
        - status
        - roomId
        - roomLabel
        - actions
      properties:
        visitId:
          type: string
        laneCode:
          type: string
        number:
          type: integer
        status:
          type: string
          enum:
            - called
            - in_room
            - directed
          description: >-
            called/in_room as today. directed = self_go underwegs zum Panel-Raum
            (Patient kann „Ich bin da“ / Angekommen quittieren).
        calledAt:
          type: string
          format: date-time
        roomId:
          type: string
        roomLabel:
          type: string
        identityRef:
          type: string
          nullable: true
          description: Only present for inside panels when showPatientNames is enabled.
        actions:
          $ref: '#/components/schemas/RoomPanelItemActions'
    RoomPanelCallCandidate:
      type: object
      additionalProperties: false
      required:
        - visitId
        - laneCode
        - number
        - status
        - roomId
        - roomLabel
        - actions
      properties:
        visitId:
          type: string
        laneCode:
          type: string
        number:
          type: integer
        status:
          type: string
          enum:
            - waiting
            - directed
        roomId:
          type: string
        roomLabel:
          type: string
        identityRef:
          type: string
          nullable: true
          description: Only present for inside panels when showPatientNames is enabled.
        actions:
          $ref: '#/components/schemas/RoomPanelItemActions'
    RoomPanelSnapshot:
      type: object
      additionalProperties: false
      required:
        - view
        - roomId
        - roomLabel
        - revision
        - serverTime
        - capabilities
        - panel
        - items
      properties:
        view:
          type: string
          const: room-panel
        roomId:
          type: string
        roomLabel:
          type: string
        revision:
          type: integer
          minimum: 0
        serverTime:
          type: string
          format: date-time
        capabilities:
          $ref: '#/components/schemas/RoomPanelCapabilities'
        panel:
          type: object
          additionalProperties: false
          required:
            - placement
            - mode
            - showPatientNames
            - calledTextPreset
            - calledTextCustom
            - arrivedTextPreset
            - arrivedTextCustom
          properties:
            placement:
              type: string
              enum:
                - outside
                - inside
            mode:
              type: string
              enum:
                - display_only
                - arrival
                - staff_full
            showPatientNames:
              type: boolean
            calledTextPreset:
              type: string
              enum:
                - you_are_right
                - please_wait_here
                - please_enter
                - go_to_reception
                - custom
            calledTextCustom:
              type: string
              nullable: true
            arrivedTextPreset:
              type: string
              enum:
                - you_are_right
                - please_wait_here
                - please_enter
                - go_to_reception
                - custom
            arrivedTextCustom:
              type: string
              nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomPanelItem'
        callCandidates:
          type: array
          description: >-
            Present only when capabilities.canCall is true. Waiting/directed visits
            with movementMode call targeting this room, oldest first.
          items:
            $ref: '#/components/schemas/RoomPanelCallCandidate'
    QueueListResponse:
      oneOf:
        - $ref: '#/components/schemas/QueueListMfaResponse'
        - $ref: '#/components/schemas/QueueListTvResponse'
        - $ref: '#/components/schemas/RoomPanelSnapshot'
    QueueSummaryResponse:
      type: object
      required:
        - waitingNow
        - calledNow
        - inRoomNow
        - absentNow
        - processedToday
        - checkinLocked
        - dayClosePhase
        - serverTime
      properties:
        waitingNow:
          type: integer
        calledNow:
          type: integer
        inRoomNow:
          type: integer
        absentNow:
          type: integer
        processedToday:
          type: integer
        checkinLocked:
          type: boolean
        dayClosePhase:
          type: string
          enum:
            - open
            - started
        serverTime:
          type: string
          format: date-time
    QueueCallResponse:
      type: object
      required:
        - visitId
        - fromStatus
        - toStatus
        - updatedAt
        - roomId
        - roomLabel
      properties:
        visitId:
          type: string
        fromStatus:
          $ref: './common.yaml#/components/schemas/QueueStatus'
        toStatus:
          $ref: './common.yaml#/components/schemas/QueueStatus'
        updatedAt:
          type: string
          format: date-time
        roomId:
          type: string
          nullable: true
        roomLabel:
          type: string
          nullable: true
    QueueRoomActionBody:
      type: object
      additionalProperties: false
      properties:
        roomId:
          type: string
        roomLabel:
          type: string
        actingRoomId:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            When set, check-in/out only succeeds if the visit's assigned room_id matches
            (room panel). Omit for MFA staff actions without room scope.
    QueueVisitTransitionRequest:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - call
            - check_in_room
            - start_treatment
            - continue_journey
            - reassign_room
            - check_out_room
            - cancel
            - return_to_waiting
            - cycle_triage
            - set_absence
            - recall
            - retry_recall_notify
        roomId:
          type: string
          minLength: 1
          maxLength: 64
        roomLabel:
          type: string
          minLength: 1
          maxLength: 128
        actingRoomId:
          type: string
          minLength: 1
          maxLength: 64
        mode:
          $ref: '#/components/schemas/AbsenceMode'
        returnWindowMinutes:
          type: integer
          minimum: 1
          maximum: 240
        notifyChannel:
          type: string
          enum:
            - sms
            - whatsapp
    QueueVisitTransitionResponse:
      oneOf:
        - $ref: '#/components/schemas/QueueTransitionResponse'
        - $ref: '#/components/schemas/QueueTriageResponse'
        - $ref: '#/components/schemas/QueueRecallResponse'
        - $ref: '#/components/schemas/QueueRecallRetryNotifyResponse'
    QueueTransitionResponse:
      type: object
      required:
        - resultType
        - visitId
        - fromStatus
        - toStatus
        - updatedAt
        - roomId
        - roomLabel
      properties:
        resultType:
          type: string
          const: transition
        visitId:
          type: string
        fromStatus:
          $ref: './common.yaml#/components/schemas/QueueStatus'
        toStatus:
          $ref: './common.yaml#/components/schemas/QueueStatus'
        updatedAt:
          type: string
          format: date-time
        roomId:
          type: string
          nullable: true
        roomLabel:
          type: string
          nullable: true
    QueueRecallResponse:
      type: object
      required:
        - resultType
        - visitId
        - fromStatus
        - toStatus
        - updatedAt
        - returnUntil
        - smsDispatch
      properties:
        resultType:
          type: string
          const: recall
        visitId:
          type: string
        fromStatus:
          $ref: './common.yaml#/components/schemas/QueueStatus'
        toStatus:
          $ref: './common.yaml#/components/schemas/QueueStatus'
        updatedAt:
          type: string
          format: date-time
        returnUntil:
          type: string
          format: date-time
        smsDispatch:
          nullable: true
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                - provider
                - attempted
                - sent
              properties:
                provider:
                  type: string
                attempted:
                  type: boolean
                sent:
                  type: boolean
                messageId:
                  type: string
                errorCode:
                  type: string
                fallbackFrom:
                  type: string
                  description: Set when WhatsApp was attempted first and SMS completed delivery.
    AbsenceMode:
      type: string
      enum:
        - wait_here
        - return_later
    MarkAbsenceLookupRequest:
      type: object
      additionalProperties: false
      properties:
        phoneNumber:
          type: string
          minLength: 3
          maxLength: 64
        ticketCode:
          type: string
          minLength: 3
          maxLength: 16
        mode:
          type: string
          enum:
            - wait_here
            - return_later
paths:
  /api/v1/queue:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Get current queue list (role-filtered payload)
      responses:
        '200':
          description: Queue list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueListResponse'
  /api/v1/queue/summary:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Get queue and daily progress summary for dashboard
      responses:
        '200':
          description: Summary counters for MFA overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSummaryResponse'
  /api/v1/queue/mark-absence:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Mark patient absent by phone number or waiting number (ticketCode) lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAbsenceLookupRequest'
      responses:
        '200':
          description: Visit marked absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTransitionResponse'
        '400':
          description: Invalid request or waiting number (ticketCode) required
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Visit not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Invalid transition or ambiguous lookup
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/queue/{visitId}/transition:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Apply a typed workflow transition to a queue visit
      parameters:
        - in: path
          name: visitId
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueVisitTransitionRequest'
      responses:
        '200':
          description: Visit transition applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueVisitTransitionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Visit not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: Panel policy forbids this action
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/queue/{visitId}/callback-phone:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    put:
      summary: Set MFA callback phone for recall SMS (separate from terminal check-in phone)
      parameters:
        - in: path
          name: visitId
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - callbackPhone
              properties:
                callbackPhone:
                  type: string
                  minLength: 3
                  maxLength: 32
      responses:
        '200':
          description: Callback phone stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCallbackPhoneResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Visit not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Visit not in a state that allows updating callback phone
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
    delete:
      summary: Clear MFA callback phone (recall falls back to terminal check-in phone)
      parameters:
        - in: path
          name: visitId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Callback phone cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCallbackPhoneClearResponse'
        '404':
          description: Visit not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Visit not in a state that allows updating callback phone
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/queue/{visitId}/identity-ref:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    patch:
      summary: Set MFA display name for a visit without identity (manual entry in waiting list)
      parameters:
        - in: path
          name: visitId
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - identityRef
              properties:
                identityRef:
                  type: string
                  minLength: 1
                  maxLength: 160
      responses:
        '200':
          description: Display name stored on visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueIdentityRefResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Visit not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Visit not in waiting list or already has a display name
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/queue/{visitId}/supersede:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Supersede a waiting/directed visit with a new topic (new waiting number, chain link, preserve wait clock)
      parameters:
        - in: path
          name: visitId
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - topicId
              properties:
                topicId:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        '200':
          description: Visit superseded; new visit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSupersedeResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: Document rebind rejected (successor link mismatch)
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Visit not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
