openapi: 3.1.0
info:
  title: Praxis Flow Documents API
  version: 0.4.0,
components:
  securitySchemes:
    clientApiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: API key
    patientSessionBearer:
      type: http
      scheme: bearer
      bearerFormat: Session token
    mfaSessionCookie:
      type: apiKey
      in: cookie
      name: pf_mfa_session
  schemas:
    PatientDocument:
      type: object
      required:
        - id
        - visitId
        - fileName
        - mimeType
        - sizeBytes
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        visitId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MfaDocument:
      allOf:
        - $ref: '#/components/schemas/PatientDocument'
        - type: object
          required:
            - source
            - sessionId
          properties:
            source:
              type: string
              enum:
                - upload
                - form
            sessionId:
              type: string
    FormTemplateField:
      type: object
      required:
        - id
        - label
        - type
        - required
        - portalControl
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
            - text
            - number
            - boolean
            - date
        required:
          type: boolean
        maxLength:
          type: integer
        portalControl:
          type: string
          enum:
            - checkbox
            - compact
            - input
            - textarea-short
            - textarea
          description: Required portal layout control chosen by the server
        min:
          type: number
        max:
          type: number
        step:
          type: number
        hideInPortalForm:
          type: boolean
        hideWhenCheckinPhone:
          type: boolean
    FormTemplateSection:
      type: object
      required:
        - titleKey
        - fieldIds
      properties:
        titleKey:
          type: string
          description: i18n key for portal section heading
        fieldIds:
          type: array
          items:
            type: string
    FormTemplate:
      type: object
      required:
        - id
        - name
        - version
        - fields
        - sections
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: integer
        sections:
          type: array
          items:
            $ref: '#/components/schemas/FormTemplateSection'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormTemplateField'
    FormTemplateDescriptor:
      type: object
      required:
        - id
        - name
        - version
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: integer
    FormPrivacyNotice:
      type: object
      required:
        - version
        - title
        - paragraphs
      properties:
        version:
          type: string
        title:
          type: string
        paragraphs:
          type: array
          items:
            type: string
    PatientFormDocumentItem:
      type: object
      additionalProperties: false
      required:
        - templateId
        - templateVersion
      properties:
        templateId:
          type: string
          minLength: 1
          maxLength: 120
        templateVersion:
          type: integer
          minimum: 1
        answers:
          type: object
          additionalProperties: true
          maxProperties: 64
    PatientDocumentListResponse:
      type: object
      required:
        - items
        - uploadMaxBytes
      properties:
        uploadMaxBytes:
          type: integer
          minimum: 1
          description: Maximum upload size in bytes enforced by the portal intake endpoint
        items:
          type: array
          items:
            $ref: '#/components/schemas/PatientDocument'
    PatientFormDocumentsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PatientDocument'
    MfaDocumentListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MfaDocument'
    MfaDocumentPreview:
      allOf:
        - $ref: '#/components/schemas/MfaDocument'
        - type: object
          required:
            - preview
          properties:
            preview:
              type: object
              required:
                - previewSessionId
                - documentId
                - status
                - updatedAt
              properties:
                previewSessionId:
                  type: string
                documentId:
                  type: string
                status:
                  type: string
                previewMode:
                  type: string
                embedUrl:
                  type: string
                  description: Same-origin embed proxy path including short-lived access query token
                updatedAt:
                  type: string
                  format: date-time
paths:
  /api/v1/patient-documents/form-templates:
    get:
      summary: List available versioned form templates
      security:
        - patientSessionBearer: []
      responses:
        '200':
          description: Template descriptors
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FormTemplateDescriptor'
        '401':
          description: Unauthorized session token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/patient-documents/form-templates/{templateId}:
    get:
      summary: Read a form template by id (optional version query)
      security:
        - patientSessionBearer: []
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: version
          required: false
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      responses:
        '200':
          description: Template definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormTemplate'
        '400':
          description: Invalid version query parameter
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized session token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/patient-documents/privacy-notice:
    get:
      summary: Privacy notice text for portal consent modal
      security:
        - patientSessionBearer: []
      responses:
        '200':
          description: Privacy notice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormPrivacyNotice'
        '401':
          description: Unauthorized session token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/patient-documents/forms:
    post:
      summary: Submit one or more form documents (PDF per item)
      security:
        - patientSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    $ref: '#/components/schemas/PatientFormDocumentItem'
      responses:
        '201':
          description: Generated PDFs accepted as documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientFormDocumentsResponse'
        '400':
          description: Invalid request, validation failed, or scan blocked
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized session token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Document template metadata consistency check failed
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '502':
          description: Sandbox render unavailable
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/sessions/resolve-ticket:
    post:
      summary: Resolve waiting number (ticketCode) to anonymous patient session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ticketCode
              properties:
                ticketCode:
                  type: string
                  minLength: 3
                  maxLength: 8
      responses:
        '201':
          description: Session resolved
          content:
            application/json:
              schema:
                type: object
                required:
                  - sessionId
                  - sessionToken
                  - expiresAt
                  - visitId
                properties:
                  sessionId:
                    type: string
                  sessionToken:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  visitId:
                    type: string
        '400':
          description: Invalid request or rate limited
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Ticket code not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Ticket not active anymore
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/sessions/captive-authorize:
    post:
      summary: Authorize guest WLAN client after portal session is active
      description: >
        Captive-adapter hook after an active patient session. Requires a patient session bearer token.
        Until a vendor adapter is wired, always returns wlanAuthorized=false and still succeeds.
      security:
        - patientSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                clientIp:
                  type: string
                  minLength: 7
                  maxLength: 45
                clientMac:
                  type: string
                  minLength: 11
                  maxLength: 17
                redirectUrl:
                  type: string
                  minLength: 1
                  maxLength: 2048
      responses:
        '200':
          description: Captive authorization result
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - wlanAuthorized
                  - redirectUrl
                properties:
                  ok:
                    type: boolean
                    const: true
                  wlanAuthorized:
                    type: boolean
                  redirectUrl:
                    type: string
        '400':
          description: Missing client identity for WLAN authorization
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized session token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '502':
          description: Captive adapter failed (reserved for future vendor adapters)
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/sessions/verify-ticket-code:
    post:
      summary: Verify waiting number (ticketCode) without creating a patient session
      description: >
        Captive-adapter S2S hook (Bearer AUTH_KEY_CAPTIVE → role captive).
        Does not rotate session tokens. No in-product caller until a vendor adapter exists.
      security:
        - clientApiKeyBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ticketCode
              properties:
                ticketCode:
                  type: string
                  minLength: 3
                  maxLength: 8
      responses:
        '200':
          description: Waiting number verified
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - visitId
                properties:
                  ok:
                    type: boolean
                    const: true
                  visitId:
                    type: string
        '404':
          description: Ticket code not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Ticket not active anymore
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/sessions/me:
    get:
      summary: Get current anonymous patient session state
      security:
        - patientSessionBearer: []
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                type: object
                required:
                  - sessionId
                  - visitId
                  - status
                  - expiresAt
                  - createdAt
                  - authPath
                  - checkinPhone
                properties:
                  sessionId:
                    type: string
                  visitId:
                    type: string
                  status:
                    type: string
                    enum:
                      - active
                      - expired
                      - revoked
                  expiresAt:
                    type: string
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
                  authPath:
                    type: string
                  checkinPhone:
                    type: ['string', 'null']
        '401':
          description: Unauthorized session token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/sessions/submit:
    post:
      summary: Close anonymous upload session after patient confirms send
      security:
        - patientSessionBearer: []
      responses:
        '200':
          description: Session closed
          content:
            application/json:
              schema:
                type: object
                required:
                  - sessionId
                  - status
                  - closedAt
                properties:
                  sessionId:
                    type: string
                  status:
                    type: string
                    const: revoked
                  closedAt:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized session token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/patient-documents/intake:
    post:
      summary: Intake patient document within anonymous session (multipart upload)
      security:
        - patientSessionBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF or image upload (max 25 MB)
      responses:
        '201':
          description: Document accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDocument'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Unauthorized session token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/patient-documents:
    get:
      summary: List patient-owned documents in current session
      security:
        - patientSessionBearer: []
      responses:
        '200':
          description: Session documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDocumentListResponse'
        '401':
          description: Unauthorized session token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/patient-documents/{documentId}/delete:
    post:
      summary: Delete patient-owned document in current session
      security:
        - patientSessionBearer: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Document marked as discarded_by_patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDocument'
        '401':
          description: Unauthorized session token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: Document belongs to different session
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Document state cannot be changed
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/documents/{visitId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: List documents for MFA processing by visit
      security:
        - mfaSessionCookie: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Visit documents for MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaDocumentListResponse'
        '404':
          description: Visit not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/documents/{documentId}/preview:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Request MFA preview lifecycle step
      security:
        - mfaSessionCookie: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Document moved to preview_requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaDocumentPreview'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '502':
          description: Sandbox preview service unavailable
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/documents/{documentId}/rename:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Rename document base file name before export (extension stays fixed)
      security:
        - mfaSessionCookie: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - baseName
              properties:
                baseName:
                  type: string
                  minLength: 1
                  maxLength: 240
      responses:
        '200':
          description: Document renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaDocument'
        '400':
          description: Invalid file name
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/documents/{documentId}/discard:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Discard document from MFA
      security:
        - mfaSessionCookie: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Document discarded by MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaDocument'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/documents/{documentId}/export-filesystem:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Synchronously export document to practice filesystem (streams from sandbox custody after preview scan)
      security:
        - mfaSessionCookie: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Document exported to filesystem with status exported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaDocument'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Invalid transition or sandbox artifact unavailable after preview
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              examples:
                invalidTransition:
                  summary: Document not yet previewed
                  value:
                    code: INVALID_TRANSITION
                    message: Document transition is not allowed.
                documentNotScanned:
                  summary: Sandbox artifact unavailable after preview
                  value:
                    code: DOCUMENT_NOT_SCANNED
                    message: Document export requires a successful preview scan and an available sandbox artifact.
