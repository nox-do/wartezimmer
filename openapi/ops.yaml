openapi: 3.1.0
info:
  title: Wartezimmer Ops API
  version: 0.2.0
security:
  - mfaSessionCookie: []
  - opsSessionCookie: []
components:
  securitySchemes:
    mfaSessionCookie:
      type: apiKey
      in: cookie
      name: pf_mfa_session
    opsSessionCookie:
      type: apiKey
      in: cookie
      name: pf_ops_session
    tvDeviceSessionCookie:
      type: apiKey
      in: cookie
      name: pf_tv_device_session
    terminalDeviceSessionCookie:
      type: apiKey
      in: cookie
      name: pf_terminal_device_session
    maintenanceBearer:
      type: http
      scheme: bearer
      description: Installation-specific token used only on the host-loopback maintenance listener.
  schemas:
    RoomPanelPlacementConfig:
      type: object
      required:
        - enabled
        - mode
        - showPatientNames
        - allowCalling
        - calledTextPreset
        - calledTextCustom
        - arrivedTextPreset
        - arrivedTextCustom
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum:
            - display_only
            - arrival
            - staff_full
        showPatientNames:
          type: boolean
          description: Patient names are only allowed for inside panels when explicitly enabled.
        allowCalling:
          type: boolean
          description: Inside panels only — enables queue call from the room tablet.
        calledTextPreset:
          type: string
          enum:
            - you_are_right
            - please_wait_here
            - please_enter
            - go_to_reception
            - custom
        calledTextCustom:
          type: string
          nullable: true
          maxLength: 80
        arrivedTextPreset:
          type: string
          enum:
            - you_are_right
            - please_wait_here
            - please_enter
            - go_to_reception
            - custom
        arrivedTextCustom:
          type: string
          nullable: true
          maxLength: 80
    RoomPanelsSettings:
      type: object
      required:
        - outside
        - inside
      additionalProperties: false
      properties:
        outside:
          $ref: '#/components/schemas/RoomPanelPlacementConfig'
        inside:
          $ref: '#/components/schemas/RoomPanelPlacementConfig'
    OpsStateResponse:
      type: object
      required:
        - checkinLocked
        - dayClosePhase
        - updatedAt
      properties:
        checkinLocked:
          type: boolean
        dayClosePhase:
          type: string
          enum:
            - open
            - started
        updatedAt:
          type: string
          format: date-time
    BusinessDayResetResponse:
      type: object
      required:
        - dayClosePhase
        - resetVisitCount
        - updatedAt
        - lastResetBusinessDay
        - sandboxRestartRequired
        - sandboxRestartInitiated
      properties:
        dayClosePhase:
          type: string
          enum:
            - open
            - started
          description: Always open after a successful business-day reset.
        resetVisitCount:
          type: integer
          description: Visits cleared during the reset (runtime queue data only).
        updatedAt:
          type: string
          format: date-time
        lastResetBusinessDay:
          type: string
          description: Business day stamped by the reset (BUSINESS_TZ).
        sandboxRestartRequired:
          type: boolean
          const: true
        sandboxRestartInitiated:
          type: boolean
          const: true
          description: Sandbox intake purge and subsequent runtime restart were confirmed before completing the reset.
    BusinessDayResetRequest:
      type: object
      required:
        - confirmBusinessDayReset
      additionalProperties: false
      properties:
        confirmBusinessDayReset:
          type: boolean
          const: true
    RuntimeResetPreviewResponse:
      type: object
      required:
        - visitCount
        - outboxEventCount
        - emergencyActive
        - preservedTopicCount
        - preservedRoomCount
        - confirmPhrase
        - serverTime
      properties:
        visitCount:
          type: integer
          minimum: 0
        outboxEventCount:
          type: integer
          minimum: 0
        emergencyActive:
          type: boolean
        preservedTopicCount:
          type: integer
          minimum: 0
        preservedRoomCount:
          type: integer
          minimum: 0
        confirmPhrase:
          type: string
        serverTime:
          type: string
          format: date-time
    RuntimeResetRequest:
      type: object
      required:
        - confirmPhrase
      additionalProperties: false
      properties:
        confirmPhrase:
          type: string
          minLength: 1
          maxLength: 64
    RuntimeResetResponse:
      type: object
      required:
        - resetVisitCount
        - clearedOutboxCount
        - emergencyCleared
        - preservedTopicCount
        - preservedRoomCount
        - checkinLocked
        - dayClosePhase
        - lastResetBusinessDay
        - updatedAt
        - sandboxRestartRequired
        - sandboxRestartInitiated
      properties:
        resetVisitCount:
          type: integer
          minimum: 0
        clearedOutboxCount:
          type: integer
          minimum: 0
        emergencyCleared:
          type: boolean
        preservedTopicCount:
          type: integer
          minimum: 0
        preservedRoomCount:
          type: integer
          minimum: 0
        checkinLocked:
          type: boolean
          const: true
        dayClosePhase:
          type: string
          enum:
            - open
            - started
        lastResetBusinessDay:
          type: string
        updatedAt:
          type: string
          format: date-time
        sandboxRestartRequired:
          type: boolean
          const: true
        sandboxRestartInitiated:
          type: boolean
          const: true
    TerminalPatientLocale:
      type: string
      enum:
        - de-DE
        - en-GB
        - tr-TR
        - ru-RU
        - uk-UA
    TerminalPatientLocales:
      type: array
      items:
        $ref: '#/components/schemas/TerminalPatientLocale'
      minItems: 1
      uniqueItems: true
      description: Patient-facing languages on terminal and portal. de-DE is always included.
    OpsPatientLocalesResponse:
      type: object
      additionalProperties: false
      required:
        - terminalPatientLocales
        - portalEnabled
      properties:
        terminalPatientLocales:
          $ref: '#/components/schemas/TerminalPatientLocales'
        portalEnabled:
          type: boolean
          description: Whether the patient portal is offered by this practice (ops onboarding setting).
    OpsHeartbeatResponse:
      type: object
      required:
        - status
        - service
        - serverTime
        - uptimeSeconds
        - checkinLocked
        - dayClosePhase
        - emergencyEnabled
        - terminalWlanPromoEnabled
        - terminalAuthPhoneEnabled
        - terminalAuthNameDobEnabled
        - terminalAuthEgkEnabled
        - terminalPatientLocales
        - emergencyActive
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: app
        serverTime:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
        checkinLocked:
          type: boolean
        dayClosePhase:
          type: string
          enum:
            - open
            - started
        emergencyEnabled:
          type: boolean
        terminalWlanPromoEnabled:
          type: boolean
        terminalAuthPhoneEnabled:
          type: boolean
          description: Show phone + date-of-birth check-in on the terminal start screen.
        terminalAuthNameDobEnabled:
          type: boolean
          description: Show last name + date-of-birth check-in on the terminal start screen.
        terminalAuthEgkEnabled:
          type: boolean
          description: Show eGK check-in on the terminal start screen.
        terminalPatientLocales:
          $ref: '#/components/schemas/TerminalPatientLocales'
        emergencyActive:
          type: boolean
    OpsOnboardingStatus:
      type: object
      required:
        - phase
        - setupCompletedAt
        - setupLastStep
        - portalEnabled
        - setupContactMode
        - checks
        - userFolders
        - requiredChecksOk
        - checksVerified
      properties:
        phase:
          type: string
          enum:
            - pristine
            - wizard_in_progress
            - completed
        setupCompletedAt:
          type: string
          nullable: true
          format: date-time
        setupLastStep:
          type: string
          enum:
            - welcome
            - practice
            - storage
            - contacts
            - messaging
            - portal
            - summary
            - verify
        portalEnabled:
          type: boolean
          description: Whether the practice offers the patient portal (Gast-WLAN / Captive flow). Host gateway setup is via Wartezimmer Manager.
        setupContactMode:
          type: string
          enum:
            - unset
            - sample
            - own
        checks:
          type: array
          items:
            type: object
            required:
              - id
              - ok
              - required
              - hint
            properties:
              id:
                type: string
              ok:
                type: boolean
              required:
                type: boolean
              hint:
                type: string
                nullable: true
        userFolders:
          type: object
          required:
            - imports
            - exports
          properties:
            imports:
              type: string
            exports:
              type: string
        requiredChecksOk:
          type: boolean
        checksVerified:
          type: boolean
          description: True after expensive storage and CSV probes.
    PracticeProfile:
      type: object
      required:
        - displayName
        - street
        - postalCode
        - city
        - phone
        - email
        - dataProtectionOfficer
        - website
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 160
          description: Public practice name shown on terminal, TV, and privacy notices.
        street:
          type: string
          maxLength: 160
        postalCode:
          type: string
          maxLength: 16
        city:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 64
        email:
          type: string
          maxLength: 160
        dataProtectionOfficer:
          type: string
          maxLength: 160
          description: Name or contact of the data protection officer, if appointed.
        website:
          type: string
          maxLength: 200
    JourneyStepSetting:
      type: object
      required:
        - id
        - sortOrder
        - movementMode
        - publicDisplayMode
        - completedWhen
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        sortOrder:
          type: integer
          minimum: 0
          maximum: 99
        targetLocationId:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          description: Enabled practice-room id or the fixed waiting-room location pf_waiting.
        queueId:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
        movementMode:
          type: string
          enum: [call, self_go, pickup]
        publicDisplayMode:
          type: string
          enum: [visible, hidden, call_only]
        completedWhen:
          type: string
          enum: [arrive, start, done]
        instructionText:
          type: string
          nullable: true
          maxLength: 256
    JourneyTemplateSetting:
      type: object
      required:
        - id
        - name
        - active
        - steps
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        name:
          type: string
          minLength: 1
          maxLength: 128
        topicId:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          description: >-
            Optional intended topic for this template. Topics assign a template via
            journeyTemplateId; when topicId is set here, only that topic may reference
            this template (validated on save). Not the on/off switch. Hidden in the MFA
            journey editor for now; new templates default to null.
        active:
          type: boolean
          description: >-
            Catalog availability for this template. Inactive templates are omitted from
            topic journey pickers and not applied on catalog sync (topic uses simple routing).
            Distinct from topic.journeyTemplateId. Save is rejected while a topic still
            references an inactive template. Hidden in the MFA journey editor for now;
            new templates default to true.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JourneyStepSetting'
    JourneySettings:
      type: object
      required:
        - templates
      additionalProperties: false
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/JourneyTemplateSetting'
    OpsSettingsResponse:
      type: object
      required:
        - routingMode
        - postWaitingCallTargetId
        - returnWindowMinutes
        - longWaitThresholdMinutes
        - practiceOpenFrom
        - practiceOpenTo
        - topics
        - journeySettings
        - rooms
        - contactLookupFolderPath
        - contactLookupDelimiterMode
        - contactLookupHasHeader
        - contactLookupMapping
        - emergencyEnabled
        - terminalWlanPromoEnabled
        - terminalAuthPhoneEnabled
        - terminalAuthNameDobEnabled
        - terminalAuthEgkEnabled
        - terminalPatientLocales
        - smsProvider
        - exportBasePath
        - practiceProfile
        - updatedAt
      properties:
        routingMode:
          type: string
          enum: [simple, complex]
          description: Practice-wide routing mode. simple preserves RoutingRules-only behavior; complex allows mixed topics with journeys later.
        postWaitingCallTargetId:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          description: Simple-routing target used when a non-assisted patient waits at pf_waiting and is called without an explicit room selection.
        longWaitThresholdMinutes:
          type: integer
          minimum: 1
          maximum: 240
          description: Waiting-time threshold in minutes for the MFA red indicator and divider. Defaults to 25; MFA-editable under Betrieb settings.
        returnWindowMinutes:
          type: integer
          minimum: 1
          maximum: 240
          description: Single recall window for countdown, SMS text, and return with/without phone. MFA-editable under Betrieb settings.
        practiceOpenFrom:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Daily check-in window start (BUSINESS_TZ local time, HH:mm).
        practiceOpenTo:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Daily check-in window end (BUSINESS_TZ local time, HH:mm).
        topics:
          type: array
          items:
            type: object
            required:
              - topicId
              - label
              - laneCode
              - defaultRoomId
              - iconId
              - accentColor
              - enabled
              - availableFrom
              - availableTo
              - sortOrder
            additionalProperties: false
            properties:
              topicId:
                type: string
                minLength: 1
                maxLength: 64
                pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
              label:
                type: string
                minLength: 1
                maxLength: 128
              laneCode:
                type: string
                pattern: '^[A-Z]$'
                description: Ticket number series letter for this topic (A–Z).
              defaultRoomId:
                type: string
                minLength: 1
                maxLength: 64
                description: Simple-routing target. pf_waiting starts the visit waiting; a practice room starts it directed/self_go.
              journeyTemplateId:
                type: string
                nullable: true
                minLength: 1
                maxLength: 128
                description: Complex routing only. When set, the topic routes via this JourneyTemplate instead of the simple default room.
              iconId:
                type: string
                nullable: true
                description: Optional curated Lucide icon id; null uses first letter of label on terminal.
              accentColor:
                type: string
                pattern: '^#[0-9A-Fa-f]{6}$'
                description: Badge and terminal tile accent (hex).
              enabled:
                type: boolean
              availableFrom:
                type: string
                nullable: true
                pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              availableTo:
                type: string
                nullable: true
                pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              sortOrder:
                type: integer
                minimum: 0
                maximum: 99
        journeySettings:
          $ref: '#/components/schemas/JourneySettings'
        rooms:
          type: array
          items:
            type: object
            required:
              - roomId
              - roomLabel
              - enabled
            additionalProperties: false
            properties:
              roomId:
                type: string
                minLength: 1
                maxLength: 64
                description: Practice-room id. Reserved waiting-room ids such as pf_waiting cannot be used here.
              roomLabel:
                type: string
                minLength: 1
                maxLength: 128
              enabled:
                type: boolean
              defaultCallTarget:
                type: boolean
                description: General catalog fallback when a topic target is unavailable. At most one enabled practice room is marked; if none is marked, pf_waiting is the fallback.
              maxOccupancy:
                type: integer
                nullable: true
                minimum: 1
                description: Maximum concurrent called or in-room visits assigned to this room. Null or omitted means unlimited.
              panels:
                $ref: '#/components/schemas/RoomPanelsSettings'
        contactLookupFolderPath:
          type: string
          nullable: true
          maxLength: 4096
          description: Absolute path to patient/contact import folder inside CONTACT_LOOKUP_BASE_PATH (e.g. /imports or /imports/pvs when IMPORTS_HOST_PATH is mounted). CSV files are scanned recursively.
        contactLookupDelimiterMode:
          type: string
          enum:
            - auto
            - semicolon
            - comma
            - tab
        contactLookupHasHeader:
          type: boolean
        contactLookupMapping:
          type: object
          required:
            - mobile
          additionalProperties: false
          properties:
            mobile:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: integer
                  minimum: 0
                  maximum: 512
            lastName:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: integer
                  minimum: 0
                  maximum: 512
            firstName:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: integer
                  minimum: 0
                  maximum: 512
            birthDate:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: integer
                  minimum: 0
                  maximum: 512
        emergencyEnabled:
          type: boolean
        terminalWlanPromoEnabled:
          type: boolean
          description: Show WLAN promo banner on check-in terminal (start + after check-in).
        terminalAuthPhoneEnabled:
          type: boolean
          description: Allow terminal check-in via mobile number and date of birth.
        terminalAuthNameDobEnabled:
          type: boolean
          description: Allow terminal check-in via last name and date of birth.
        terminalAuthEgkEnabled:
          type: boolean
          description: Allow terminal check-in via eGK card reader flow.
        terminalPatientLocales:
          $ref: '#/components/schemas/TerminalPatientLocales'
        smsProvider:
          type: string
          enum:
            - mock
            - seven
        exportBasePath:
          type: string
          minLength: 1
          maxLength: 4096
          description: Effective export base path from deployment configuration (EXPORT_BASE_PATH).
        practiceProfile:
          $ref: '#/components/schemas/PracticeProfile'
        updatedAt:
          type: string
          format: date-time
    RoutingCapabilitiesResponse:
      type: object
      required:
        - routingMode
        - openVisitCount
        - features
      additionalProperties: false
      properties:
        routingMode:
          type: string
          enum: [simple, complex]
        openVisitCount:
          type: integer
          minimum: 0
          description: Open waiting numbers (non-terminal visits). Routing mode changes are blocked while this is greater than zero.
        features:
          type: object
          required:
            - complexRouting
            - journeyDesigner
            - routingSimulator
            - complexRoutingLicensed
          additionalProperties: false
          properties:
            complexRouting:
              type: boolean
            journeyDesigner:
              type: boolean
            routingSimulator:
              type: boolean
            complexRoutingLicensed:
              type: boolean
    SettingsSnapshotAuthSettingsV1:
      type: object
      required:
        - staffPinHashMfa
        - staffPinHashOps
        - roomPanelPinHash
      additionalProperties: false
      properties:
        staffPinHashMfa:
          type: string
        staffPinHashOps:
          type: string
        roomPanelPinHash:
          type: string
    SettingsSnapshotMessagingProviderConfigV1:
      type: object
      required:
        - providerId
        - channel
        - enabled
        - credentialsJson
      additionalProperties: false
      properties:
        providerId:
          type: string
        channel:
          type: string
          enum: [sms, messenger]
        enabled:
          type: boolean
        credentialsJson:
          type: string
    SettingsSnapshotOpsSettingsV1:
      type: object
      additionalProperties: true
      description: Ops settings catalog snapshot (topics, rooms, journeys, terminal flags, etc.).
    SettingsSnapshotDbV1:
      type: object
      required:
        - settingsFormatVersion
        - exportedAt
        - opsSettings
        - authSettings
        - messagingProviderConfigs
      additionalProperties: false
      properties:
        settingsFormatVersion:
          type: integer
          const: 1
        exportedAt:
          type: string
          format: date-time
        opsSettings:
          $ref: '#/components/schemas/SettingsSnapshotOpsSettingsV1'
        authSettings:
          $ref: '#/components/schemas/SettingsSnapshotAuthSettingsV1'
        messagingProviderConfigs:
          type: array
          items:
            $ref: '#/components/schemas/SettingsSnapshotMessagingProviderConfigV1'
    SettingsSnapshotV1:
      type: object
      required:
        - settingsFormatVersion
        - exportedAt
        - opsSettings
        - authSettings
        - messagingProviderConfigs
      additionalProperties: false
      properties:
        settingsFormatVersion:
          type: integer
          const: 1
        exportedAt:
          type: string
          format: date-time
        opsSettings:
          $ref: '#/components/schemas/SettingsSnapshotOpsSettingsV1'
        authSettings:
          $ref: '#/components/schemas/SettingsSnapshotAuthSettingsV1'
        messagingProviderConfigs:
          type: array
          items:
            $ref: '#/components/schemas/SettingsSnapshotMessagingProviderConfigV1'
        env:
          type: object
          description: Optional host environment. The app ignores it during DB-only imports.
          additionalProperties:
            type: string
    MaintenanceApiInfo:
      type: object
      required:
        - protocolVersion
        - stackVersion
        - snapshotExportFormatVersion
        - snapshotImportFormatVersions
      additionalProperties: false
      properties:
        protocolVersion:
          type: integer
          const: 1
        stackVersion:
          type: [string, 'null']
        snapshotExportFormatVersion:
          type: integer
        snapshotImportFormatVersions:
          type: array
          items:
            type: integer
    SettingsSnapshotValidationResult:
      type: object
      required:
        - ok
        - errors
      additionalProperties: false
      properties:
        ok:
          type: boolean
        errors:
          type: array
          items:
            type: string
        code:
          type: string
          enum:
            - UNKNOWN_FORMAT_VERSION
            - INVALID_SNAPSHOT
            - OPS_SETTINGS_INVALID
            - CATALOG_INTEGRITY_FAILED
            - IMPORT_FAILED
    DeviceAuthorizationCopyRow:
      type: object
      additionalProperties: false
      required:
        - authorizationId
        - role
        - deviceId
        - roomId
        - placement
        - tokenHash
        - createdAt
        - lastSeenAt
        - updatedAt
      properties:
        authorizationId:
          type: string
          minLength: 1
        role:
          type: string
          enum: [tv, terminal, room-panel]
        deviceId:
          type: string
          nullable: true
        roomId:
          type: string
          nullable: true
        placement:
          type: string
          nullable: true
          enum: [outside, inside]
        tokenHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    DeviceAuthorizationImportRequest:
      type: object
      additionalProperties: false
      required:
        - authorizations
      properties:
        authorizations:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAuthorizationCopyRow'
    DeviceAuthorizationImportReport:
      type: object
      additionalProperties: false
      required:
        - ok
        - imported
      properties:
        ok:
          type: boolean
          const: true
        imported:
          type: integer
          minimum: 0
    DeviceAuthorizationListItem:
      type: object
      additionalProperties: false
      required:
        - authorizationId
        - role
        - createdAt
        - lastSeenAt
      properties:
        authorizationId:
          type: string
          minLength: 1
        role:
          type: string
          enum: [tv, terminal, room-panel]
        deviceId:
          type: string
          minLength: 1
          nullable: true
        roomId:
          type: string
          minLength: 1
          nullable: true
        placement:
          type: string
          enum: [outside, inside]
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
    DeviceAuthorizationListResponse:
      type: object
      additionalProperties: false
      required:
        - authorizations
      properties:
        authorizations:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAuthorizationListItem'
    DeviceAuthorizationRevokeReport:
      type: object
      additionalProperties: false
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
    SettingsSnapshotImportReport:
      type: object
      required:
        - ok
        - settingsFormatVersion
        - exportedAt
        - routingMode
        - portalEnabled
        - setupContactMode
        - messagingProviderCount
        - catalogIntegrityOk
        - skipProviderCredentials
        - providerCredentialsSkipped
        - disabledProviderIds
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
        settingsFormatVersion:
          type: integer
          const: 1
        exportedAt:
          type: string
          format: date-time
        routingMode:
          type: string
          enum: [simple, complex]
        portalEnabled:
          type: boolean
        setupContactMode:
          type: string
          enum: [unset, sample, own]
        messagingProviderCount:
          type: integer
          minimum: 0
        catalogIntegrityOk:
          type: boolean
          const: true
        skipProviderCredentials:
          type: boolean
        providerCredentialsSkipped:
          type: boolean
        disabledProviderIds:
          type: array
          items:
            type: string
    SettingsSnapshotImportError:
      type: object
      required:
        - ok
        - errors
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: false
        code:
          type: string
          enum:
            - UNKNOWN_FORMAT_VERSION
            - INVALID_SNAPSHOT
            - OPS_SETTINGS_INVALID
            - CATALOG_INTEGRITY_FAILED
            - IMPORT_FAILED
        errors:
          type: array
          items:
            type: string
    DeploymentVolumeStatus:
      type: object
      required:
        - containerPath
        - userFolderLabel
        - ready
        - hint
        - csvFiles
        - importFolders
      properties:
        containerPath:
          type: string
        userFolderLabel:
          type: string
        ready:
          type: boolean
        hint:
          type: string
          nullable: true
        csvFiles:
          type: array
          items:
            type: object
            required:
              - fileName
              - containerPath
              - sizeBytes
              - updatedAt
            properties:
              fileName:
                type: string
              containerPath:
                type: string
              sizeBytes:
                type: integer
                minimum: 0
              updatedAt:
                type: string
                format: date-time
        importFolders:
          type: array
          items:
            type: object
            required:
              - label
              - containerPath
            properties:
              label:
                type: string
              containerPath:
                type: string
    DeploymentStorageResponse:
      type: object
      required:
        - imports
        - exports
        - serverTime
      properties:
        imports:
          $ref: '#/components/schemas/DeploymentVolumeStatus'
        exports:
          $ref: '#/components/schemas/DeploymentVolumeStatus'
        serverTime:
          type: string
          format: date-time
    ContactLookupValidateRequest:
      type: object
      required:
        - contactLookupFolderPath
        - contactLookupDelimiterMode
        - contactLookupHasHeader
        - contactLookupMapping
      additionalProperties: false
      properties:
        contactLookupFolderPath:
          type: string
          minLength: 1
          maxLength: 4096
        contactLookupDelimiterMode:
          type: string
          enum:
            - auto
            - semicolon
            - comma
            - tab
        contactLookupHasHeader:
          type: boolean
        contactLookupMapping:
          type: object
          required:
            - mobile
          additionalProperties: false
          properties:
            mobile:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: integer
                  minimum: 0
                  maximum: 512
            lastName:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: integer
                  minimum: 0
                  maximum: 512
            firstName:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: integer
                  minimum: 0
                  maximum: 512
            birthDate:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: integer
                  minimum: 0
                  maximum: 512
    ContactLookupValidateResponse:
      type: object
      required:
        - ok
        - detectedDelimiterMode
        - layout
        - csvFileCount
        - patientCount
        - sampleRows
      properties:
        ok:
          type: boolean
          const: true
        detectedDelimiterMode:
          type: string
          enum:
            - semicolon
            - comma
            - tab
        layout:
          type: string
          enum:
            - list
            - per_patient
            - mixed
        csvFileCount:
          type: integer
          minimum: 0
        patientCount:
          type: integer
          minimum: 0
        sampleRows:
          type: integer
          minimum: 0
    ContactLookupPreviewResponse:
      type: object
      required:
        - detectedDelimiterMode
        - layout
        - csvFileCount
        - patientCount
        - columns
        - sampleRows
        - sampleSourceFile
        - suggestedMapping
        - scannedAt
      properties:
        detectedDelimiterMode:
          type: string
          enum:
            - semicolon
            - comma
            - tab
        layout:
          type: string
          enum:
            - list
            - per_patient
            - mixed
        csvFileCount:
          type: integer
          minimum: 0
        patientCount:
          type: integer
          minimum: 0
        columns:
          type: array
          items:
            type: string
        sampleRows:
          type: array
          items:
            type: array
            items:
              type: string
        sampleSourceFile:
          type: string
        scannedAt:
          type: string
          format: date-time
        suggestedMapping:
          type: object
          additionalProperties: false
          properties:
            mobile:
              oneOf:
                - type: string
                - type: integer
            lastName:
              oneOf:
                - type: string
                - type: integer
            firstName:
              oneOf:
                - type: string
                - type: integer
            birthDate:
              oneOf:
                - type: string
                - type: integer
    OutboxStatusResponse:
      type: object
      required:
        - readyCount
        - retryScheduledCount
        - deadLetterCount
        - oldestPendingCreatedAt
        - serverTime
      properties:
        readyCount:
          type: integer
        retryScheduledCount:
          type: integer
        deadLetterCount:
          type: integer
        oldestPendingCreatedAt:
          type: string
          nullable: true
          format: date-time
        serverTime:
          type: string
          format: date-time
    DayLifecycleResponse:
      type: object
      required:
        - businessDay
        - lastResetBusinessDay
        - needsDayStartHint
        - checkinLocked
        - dayClosePhase
        - lastDayStats
      properties:
        businessDay:
          type: string
          description: Current business day computed in BUSINESS_TZ.
        lastResetBusinessDay:
          type: string
          description: Business day of the last successful business-day reset (MFA „Neuen Tag starten“).
        needsDayStartHint:
          type: boolean
        checkinLocked:
          type: boolean
        dayClosePhase:
          type: string
          enum:
            - open
            - started
        lastDayStats:
          oneOf:
            - type: 'null'
            - type: object
              required:
                - businessDay
                - totalVisits
                - maxWaitMs
                - byTopic
                - openVisits
              properties:
                businessDay:
                  type: string
                totalVisits:
                  type: integer
                maxWaitMs:
                  type: integer
                  description: Longest wait from arrival until call (ms), among visits that were called.
                byTopic:
                  type: array
                  items:
                    type: object
                    required:
                      - topicId
                      - topicLabel
                      - count
                    properties:
                      topicId:
                        type: string
                      topicLabel:
                        type: string
                      count:
                        type: integer
                openVisits:
                  type: array
                  description: Non-closed visits from that business day (shown read-only before day start reset).
                  items:
                    type: object
                    required:
                      - visitId
                      - laneCode
                      - number
                      - topicLabel
                      - identityRef
                      - status
                    properties:
                      visitId:
                        type: string
                      laneCode:
                        type: string
                      number:
                        type: integer
                      topicLabel:
                        type: string
                      identityRef:
                        type: string
                        nullable: true
                      status:
                        type: string
                        enum:
                          - waiting
                          - called
                          - in_room
                          - absent_wait_here
                          - absent_return_later
    DevicePresenceRequest:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
        clientTime:
          type: string
          format: date-time
        lastRevision:
          type: integer
          minimum: 0
    EmergencyRaiseResponse:
      type: object
      required:
        - emergencyId
        - status
        - raisedAt
        - alreadyActive
      properties:
        emergencyId:
          type: string
          minLength: 1
        status:
          type: string
          const: raised
        raisedAt:
          type: string
          format: date-time
        alreadyActive:
          type: boolean
    EmergencyAcknowledgeRequest:
      type: object
      required:
        - emergencyId
        - uiDisplayed
      additionalProperties: false
      properties:
        emergencyId:
          type: string
          minLength: 1
          maxLength: 128
        uiDisplayed:
          type: boolean
          const: true
    EmergencyAcknowledgeResponse:
      type: object
      required:
        - emergencyId
        - status
        - raisedAt
        - acknowledgedAt
        - uiDisplayed
      properties:
        emergencyId:
          type: string
          minLength: 1
        status:
          type: string
          const: acknowledged
        raisedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
        uiDisplayed:
          type: boolean
          const: true
    MessagingProviderCatalogResponse:
      type: object
      required:
        - channels
      properties:
        channels:
          type: array
          items:
            type: object
            required:
              - id
              - providers
            properties:
              id:
                type: string
                enum:
                  - sms
                  - messenger
              providers:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - label
                    - channel
                    - configured
                    - enabled
                    - requires
                    - hasApiKey
                    - settings
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    channel:
                      type: string
                      enum:
                        - sms
                        - messenger
                    configured:
                      type: boolean
                    enabled:
                      type: boolean
                    hasApiKey:
                      type: boolean
                    settings:
                      type: object
                      required: [from, template, language]
                      properties:
                        from:
                          type: string
                        template:
                          type: string
                        language:
                          type: string
                    requires:
                      type: array
                      items:
                        type: string
paths:
  /api/v1/ops/health:
    get:
      summary: Service health endpoint
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - timestamp
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  stackVersion:
                    type: string
                    nullable: true
                    description: Stack release version baked into the app image (null in local/dev builds)
  /api/v1/practice/profile:
    get:
      summary: Public practice profile for patient-facing UIs
      description: Returns resolved practice contact data for privacy notices and display labels.
      security: []
      responses:
        '200':
          description: Practice profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeProfile'
  /api/v1/ops/patient-locales:
    get:
      summary: Enabled patient-facing languages (terminal and portal)
      description: Public snapshot of languages patients may choose. German is always included.
      security: []
      responses:
        '200':
          description: Enabled patient locales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsPatientLocalesResponse'
  /api/v1/ops/heartbeat:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Heartbeat for polling clients (e.g. waiting-room TV browser)
      responses:
        '200':
          description: Heartbeat with runtime status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsHeartbeatResponse'
  /api/v1/ops/settings:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Read operations settings
      responses:
        '200':
          description: Current operations settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSettingsResponse'
    patch:
      summary: Update operations settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                expectedUpdatedAt:
                  type: string
                  format: date-time
                  description: Reject the update when settings changed since this revision was read.
                routingMode:
                  type: string
                  enum: [simple, complex]
                postWaitingCallTargetId:
                  type: string
                  nullable: true
                  minLength: 1
                  maxLength: 64
                longWaitThresholdMinutes:
                  type: integer
                  minimum: 1
                  maximum: 240
                returnWindowMinutes:
                  type: integer
                  minimum: 1
                  maximum: 240
                practiceOpenFrom:
                  type: string
                  pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                practiceOpenTo:
                  type: string
                  pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                topics:
                  type: array
                  items:
                    type: object
                    required:
                      - topicId
                    additionalProperties: false
                    properties:
                      topicId:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
                      label:
                        type: string
                        minLength: 1
                        maxLength: 128
                      laneCode:
                        type: string
                        pattern: '^[A-Z]$'
                      defaultRoomId:
                        type: string
                        minLength: 1
                        maxLength: 64
                        description: Simple-routing target; may be pf_waiting.
                      journeyTemplateId:
                        type: string
                        nullable: true
                        minLength: 1
                        maxLength: 128
                      iconId:
                        type: string
                        nullable: true
                      accentColor:
                        type: string
                        pattern: '^#[0-9A-Fa-f]{6}$'
                      enabled:
                        type: boolean
                      availableFrom:
                        type: string
                        nullable: true
                        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                      availableTo:
                        type: string
                        nullable: true
                        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                      sortOrder:
                        type: integer
                        minimum: 0
                        maximum: 99
                rooms:
                  type: array
                  items:
                    type: object
                    required:
                      - roomId
                      - roomLabel
                    additionalProperties: false
                    properties:
                      roomId:
                        type: string
                        minLength: 1
                        maxLength: 64
                        description: Practice-room id. Reserved waiting-room ids such as pf_waiting cannot be used here.
                      roomLabel:
                        type: string
                        minLength: 1
                        maxLength: 128
                      enabled:
                        type: boolean
                      defaultCallTarget:
                        type: boolean
                      maxOccupancy:
                        type: integer
                        nullable: true
                        minimum: 1
                      panels:
                        type: object
                        additionalProperties: false
                        properties:
                          outside:
                            type: object
                            additionalProperties: false
                            properties:
                              enabled:
                                type: boolean
                              mode:
                                type: string
                                enum:
                                  - display_only
                                  - arrival
                                  - staff_full
                              showPatientNames:
                                type: boolean
                              allowCalling:
                                type: boolean
                              calledTextPreset:
                                type: string
                                enum:
                                  - you_are_right
                                  - please_wait_here
                                  - please_enter
                                  - go_to_reception
                                  - custom
                              calledTextCustom:
                                type: string
                                nullable: true
                                maxLength: 80
                              arrivedTextPreset:
                                type: string
                                enum:
                                  - you_are_right
                                  - please_wait_here
                                  - please_enter
                                  - go_to_reception
                                  - custom
                              arrivedTextCustom:
                                type: string
                                nullable: true
                                maxLength: 80
                          inside:
                            type: object
                            additionalProperties: false
                            properties:
                              enabled:
                                type: boolean
                              mode:
                                type: string
                                enum:
                                  - display_only
                                  - arrival
                                  - staff_full
                              showPatientNames:
                                type: boolean
                              allowCalling:
                                type: boolean
                              calledTextPreset:
                                type: string
                                enum:
                                  - you_are_right
                                  - please_wait_here
                                  - please_enter
                                  - go_to_reception
                                  - custom
                              calledTextCustom:
                                type: string
                                nullable: true
                                maxLength: 80
                              arrivedTextPreset:
                                type: string
                                enum:
                                  - you_are_right
                                  - please_wait_here
                                  - please_enter
                                  - go_to_reception
                                  - custom
                              arrivedTextCustom:
                                type: string
                                nullable: true
                                maxLength: 80
                contactLookupFolderPath:
                  type: string
                  nullable: true
                  maxLength: 4096
                contactLookupDelimiterMode:
                  type: string
                  enum:
                    - auto
                    - semicolon
                    - comma
                    - tab
                contactLookupHasHeader:
                  type: boolean
                contactLookupMapping:
                  type: object
                  required:
                    - mobile
                  additionalProperties: false
                  properties:
                    mobile:
                      oneOf:
                        - type: string
                          minLength: 1
                          maxLength: 128
                        - type: integer
                          minimum: 0
                          maximum: 512
                    lastName:
                      oneOf:
                        - type: string
                          minLength: 1
                          maxLength: 128
                        - type: integer
                          minimum: 0
                          maximum: 512
                    firstName:
                      oneOf:
                        - type: string
                          minLength: 1
                          maxLength: 128
                        - type: integer
                          minimum: 0
                          maximum: 512
                    birthDate:
                      oneOf:
                        - type: string
                          minLength: 1
                          maxLength: 128
                        - type: integer
                          minimum: 0
                          maximum: 512
                emergencyEnabled:
                  type: boolean
                terminalWlanPromoEnabled:
                  type: boolean
                terminalAuthPhoneEnabled:
                  type: boolean
                terminalAuthNameDobEnabled:
                  type: boolean
                terminalAuthEgkEnabled:
                  type: boolean
                terminalPatientLocales:
                  $ref: '#/components/schemas/TerminalPatientLocales'
                journeySettings:
                  $ref: '#/components/schemas/JourneySettings'
                smsProvider:
                  type: string
                  enum:
                    - mock
                    - seven
                practiceProfile:
                  $ref: '#/components/schemas/PracticeProfile'
      responses:
        '200':
          description: Updated operations settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSettingsResponse'
        '400':
          description: >-
            Invalid request. Room guard failures return ROOM_BLOCKED_TOPICS (details.topics),
            ROOM_BLOCKED_QUEUE (details.tickets), or ROOM_BLOCKED_CAPACITY (details.tickets)
            when removing, renaming, deactivating, or lowering maxOccupancy below current use.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: >-
            Role is not allowed to patch the requested settings fields, or complex routing
            is not licensed (COMPLEX_ROUTING_NOT_LICENSED).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Settings revision conflict or routing mode change blocked while waiting numbers are still open
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/settings/capabilities:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Read routing capabilities for UI and guards
      responses:
        '200':
          description: Current routing capabilities derived from settings and feature state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingCapabilitiesResponse'
  /api/v1/ops/settings/snapshot:
    get:
      summary: Export DB settings snapshot (maintenance listener)
      description: |
        Exports ops, auth, and messaging provider settings from SQLite without host `.env`.
        Served on the maintenance HTTP listener (host loopback, e.g. port 8082). No session auth.
      security:
        - maintenanceBearer: []
      responses:
        '200':
          description: DB-only settings snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSnapshotDbV1'
        '401':
          description: Missing or invalid maintenance token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/settings/snapshot/validate:
    post:
      summary: Validate settings snapshot for restore (maintenance listener)
      description: |
        Parses and validates a full settings snapshot (including `env` when present).
        Maintenance listener only; used by Setup for `.pfbackup` / `.pfupdate` compatibility checks.
      security:
        - maintenanceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsSnapshotV1'
      responses:
        '200':
          description: Validation result (`ok` false still returns HTTP 200)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSnapshotValidationResult'
        '401':
          description: Missing or invalid maintenance token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/settings/snapshot/import:
    post:
      summary: Import settings snapshot into SQLite (maintenance listener)
      description: |
        Replaces ops/auth/messaging settings in the app database. Maintenance listener only.
        Host `.env` is not modified — Setup merges env when building `.pfbackup`.
      security:
        - maintenanceBearer: []
      parameters:
        - name: skipProviderCredentials
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
          description: When `true`, messaging provider credentials are not restored from the snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsSnapshotV1'
      responses:
        '200':
          description: Import succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSnapshotImportReport'
        '400':
          description: Invalid snapshot, import failure, or invalid query parameter
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SettingsSnapshotImportError'
                  - $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Missing or invalid maintenance token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/maintenance/info:
    get:
      summary: Read the authenticated maintenance protocol and snapshot capabilities
      description: Lightweight compatibility handshake on the host-loopback maintenance listener.
      security:
        - maintenanceBearer: []
      responses:
        '200':
          description: Maintenance protocol identity and supported settings formats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceApiInfo'
        '401':
          description: Missing or invalid maintenance token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/device-authorizations:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: List active device authorizations
      description: MFA can list and revoke durable TV, terminal, and room-panel grants.
      responses:
        '200':
          description: Active device grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationListResponse'
  /api/v1/ops/device-authorizations/{authorizationId}/revoke:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Revoke one device authorization
      parameters:
        - name: authorizationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Grant revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationRevokeReport'
        '404':
          description: Grant not found or already revoked
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/device-authorizations/import:
    post:
      summary: Import active device authorizations (maintenance listener)
      description: |
        Writes hashed device grants into the fresh SQLite after settings import.
        Used only by `.pfupdate` cutover. Restore must not call this endpoint.
        Maintenance listener only; no session auth.
      security:
        - maintenanceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationImportRequest'
      responses:
        '200':
          description: Rows imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationImportReport'
        '400':
          description: Invalid rows or constraint failure
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          description: Missing or invalid maintenance token
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/settings/onboarding/verify:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      security:
        - opsSessionCookie: []
      summary: Verify setup checks (expensive probes)
      description: Requires authenticated ops client key. Runs storage and CSV health checks.
      responses:
        '200':
          description: Verified onboarding snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsOnboardingStatus'
        '403':
          description: Onboarding verify requires ops role
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/settings/onboarding:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Read setup onboarding progress (lightweight)
      description: Returns wizard progress and cheap checks only. Run POST …/onboarding/verify for storage and CSV probes.
      responses:
        '200':
          description: Onboarding snapshot for the setup wizard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsOnboardingStatus'
    patch:
      summary: Update onboarding progress or complete/reopen setup
      description: Requires authenticated ops client key. Progress fields are ops-only; MFA receives 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                setupLastStep:
                  type: string
                  enum:
                    - welcome
                    - practice
                    - storage
                    - contacts
                    - messaging
                    - portal
                    - summary
                    - verify
                portalEnabled:
                  type: boolean
                setupContactMode:
                  type: string
                  enum:
                    - unset
                    - sample
                    - own
                reopenOnboarding:
                  type: boolean
                  const: true
                completeOnboarding:
                  type: boolean
                  const: true
      responses:
        '200':
          description: Updated onboarding snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsOnboardingStatus'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '403':
          description: Onboarding patch requires ops role
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Setup incomplete or already completed
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/deployment/storage:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Read deployment import/export volume readiness
      description: Requires authenticated ops client key.
      responses:
        '200':
          description: Storage volume snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentStorageResponse'
  /api/v1/ops/contact-lookup/preview:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Preview CSV contact lookup folder scan and suggest column mapping
      description: Requires authenticated ops client key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactLookupValidateRequest'
      responses:
        '200':
          description: Preview succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactLookupPreviewResponse'
        '400':
          description: Invalid mapping or unreadable folder
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/contact-lookup/validate:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Validate CSV contact lookup settings
      description: Requires authenticated ops client key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactLookupValidateRequest'
      responses:
        '200':
          description: Validation succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactLookupValidateResponse'
        '400':
          description: Invalid mapping or unreadable import folder
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/contact-lookup/apply-demo:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Apply demo contact CSV for setup wizard
      description: Requires authenticated ops client key.
      responses:
        '200':
          description: Updated onboarding snapshot after applying demo contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsOnboardingStatus'
  /api/v1/ops/messaging/providers:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: List messaging providers and channel availability for UI settings
      description: Requires authenticated MFA client key in v1.
      responses:
        '200':
          description: Available providers grouped by channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagingProviderCatalogResponse'
  /api/v1/ops/messaging/providers/{providerId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    patch:
      summary: Update messaging provider settings and credentials
      description: Requires authenticated MFA client key in v1.
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            enum:
              - mock
              - seven
              - seven_whatsapp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                credentials:
                  type: object
                  additionalProperties:
                    type: string
                    minLength: 1
                    maxLength: 2048
      responses:
        '200':
          description: Updated provider descriptor
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - label
                  - channel
                  - configured
                  - enabled
                  - requires
                properties:
                  id:
                    type: string
                    enum:
                      - mock
                      - seven
                      - seven_whatsapp
                  label:
                    type: string
                  channel:
                    type: string
                    enum:
                      - sms
                      - messenger
                  configured:
                    type: boolean
                  enabled:
                    type: boolean
                  requires:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/maintenance/runtime-reset/preview:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Preview ops runtime reset impact (ops role)
      description: Requires authenticated ops client key. Returns counts and confirm phrase for POST.
      responses:
        '200':
          description: Preview snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResetPreviewResponse'
  /api/v1/ops/maintenance/runtime-reset:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Execute ops runtime reset (ops role)
      description: >-
        Purges sandbox intake synchronously and confirms the sandbox runtime restart before clearing visits, outbox, and active emergency;
        preserves practice settings and messaging credentials. On purge or restart failure the reset is not committed
        and check-in remains locked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeResetRequest'
      responses:
        '200':
          description: Runtime reset completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResetResponse'
        '400':
          description: Invalid confirm phrase or request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Another reset is already in progress
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '503':
          description: Sandbox intake purge or restart failed; the persistent reset lock remains active and the runtime reset is not committed
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/outbox-status:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Read outbox delivery status (ready, retry, dead-letter)
      description: Requires authenticated MFA client key in v1.
      responses:
        '200':
          description: Current outbox processing state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxStatusResponse'
  /api/v1/ops/day-lifecycle:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Read day lifecycle state and day-change warning hint
      description: Requires authenticated MFA client key in v1.
      responses:
        '200':
          description: Current business day status for MFA operation lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayLifecycleResponse'
  /api/v1/ops/day-lifecycle/reset:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Reset runtime for a new business day
      description: >-
        Locks check-in and document processing, purges sandbox intake synchronously and confirms its runtime restart.
        Only then clears visits and outbox runtime data and stamps lastResetBusinessDay. Settings are preserved. This is the MFA „Neuen Tag starten“
        action — not the same as starting day-close (Tagesabschluss).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessDayResetRequest'
      responses:
        '200':
          description: Business-day reset completed after confirmed sandbox restart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDayResetResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Another reset is already in progress
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '503':
          description: Sandbox intake purge or restart failed; the persistent reset lock remains active and the business-day reset is not committed
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/device/presence:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Device heartbeat (presence)
      security:
        - tvDeviceSessionCookie: []
        - terminalDeviceSessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePresenceRequest'
      responses:
        '204':
          description: Presence recorded
  /api/v1/ops/device/stream:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: Device presence stream (SSE keepalive)
      security:
        - tvDeviceSessionCookie: []
        - terminalDeviceSessionCookie: []
      description: >-
        Lightweight SSE for paired TV/terminal liveness. TV may use queue/stream instead;
        terminal uses this channel for immediate offline detection at MFA.
      responses:
        '200':
          description: SSE stream open
          content:
            text/event-stream:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/emergency/raise:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Raise emergency from terminal or MFA client
      security:
        - mfaSessionCookie: []
        - terminalDeviceSessionCookie: []
      description: Requires authenticated terminal or MFA client key in v1.
      responses:
        '200':
          description: Emergency is active (or already active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyRaiseResponse'
        '409':
          description: Emergency is disabled or terminal is currently locked
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/emergency/ack:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Acknowledge emergency after UI displayed emergency state
      security:
        - mfaSessionCookie: []
      description: Requires authenticated MFA client key in v1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyAcknowledgeRequest'
      responses:
        '200':
          description: Emergency acknowledgement persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyAcknowledgeResponse'
        '404':
          description: Emergency id not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/checkin-lock:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Lock or unlock check-in creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - locked
              properties:
                locked:
                  type: boolean
      responses:
        '200':
          description: Lock state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsStateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Lock state conflict during day-close
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
  /api/v1/ops/day-close/start:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Start day-close phase (Tagesabschluss)
      description: >-
        Future use: explicit end-of-day phase before export/archiving. Locks check-in creation
        while phase is started. Does not reset runtime data — use POST /ops/day-lifecycle/reset for that.
      responses:
        '200':
          description: Day-close started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsStateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Precondition failed or phase conflict
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
