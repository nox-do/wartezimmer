openapi: 3.1.0
info:
  title: Praxis Flow Common Schemas
  version: 0.2.0
components:
  schemas:
    ApiErrorCode:
      type: string
      description: Machine-readable API error code returned in Error responses.
      enum:
        - INVALID_ARGUMENT
        - INTERNAL_ERROR
        - NOT_FOUND
        - AUTH_UNAUTHORIZED
        - AUTH_FORBIDDEN
        - RATE_LIMITED
        - TICKET_NOT_FOUND
        - DOCUMENT_NOT_FOUND
        - DOCUMENT_FORBIDDEN
        - INVALID_TRANSITION
        - ROOM_REQUIRED
        - MISSING_CALLBACK_PHONE
        - CHECKIN_LOCK_REQUIRED
        - DAY_CLOSE_IN_PROGRESS
        - INVALID_DAY_CLOSE_PHASE
        - DAY_CLOSE_NOT_STARTED
        - UNKNOWN_MESSAGING_PROVIDER
        - CHECKIN_LOCKED
        - CHECKIN_AUTH_PATH_DISABLED
        - CHECKIN_CLOSED
        - TOPIC_DISABLED
        - TOPIC_CLOSED
        - DOCUMENT_NOT_SCANNED
        - EXPORT_BLOCKED_MALWARE
        - OPS_SETTINGS_INVALID
        - EMERGENCY_DISABLED
        - EMERGENCY_NOT_FOUND
        - SETUP_INCOMPLETE
        - SETUP_ALREADY_COMPLETED
        - SESSION_INVALID_TICKET
        - SESSION_TICKET_NOT_ACTIVE
        - SESSION_ALREADY_ACTIVE
        - SESSION_UNAUTHORIZED
        - SESSION_EXPIRED
        - FORM_TEMPLATE_NOT_FOUND
        - DOCUMENT_INTAKE_BLOCKED
        - DOCUMENT_TEMPLATE_METADATA_INVALID
        - DOCUMENT_SCHEMA_OUTDATED
        - SANDBOX_UNAVAILABLE
        - CAPTIVE_CLIENT_MISSING
        - CAPTIVE_AUTH_FAILED
        - CALL_ANNOUNCEMENT_OFFLINE
        - ROOM_AT_CAPACITY
        - ROOM_BLOCKED_TOPICS
        - ROOM_BLOCKED_QUEUE
        - ROOM_BLOCKED_CAPACITY
        - RECALL_NOTIFY_RETRY_NOT_ALLOWED
        - RECALL_WINDOW_EXPIRED
        - UNKNOWN_TOPIC
        - TERMINAL_OFFLINE
        - TERMINAL_PHONE_INVALID
        - TERMINAL_BIRTH_DATE_INVALID
        - TERMINAL_LAST_NAME_INVALID
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: Optional extra context for debugging.
    QueueStatus:
      type: string
      enum:
        - waiting
        - called
        - in_room
        - done
        - absent_wait_here
        - absent_return_later
        - cancelled
