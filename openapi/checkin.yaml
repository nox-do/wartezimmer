openapi: 3.1.0
info:
  title: Wartezimmer Check-in API
  version: 0.2.0
security:
  - mfaSessionCookie: []
  - terminalDeviceSessionCookie: []
components:
  securitySchemes:
    mfaSessionCookie:
      type: apiKey
      in: cookie
      name: pf_mfa_session
    terminalDeviceSessionCookie:
      type: apiKey
      in: cookie
      name: pf_terminal_device_session
  schemas:
    VisitCreated:
      type: object
      required:
        - visitId
        - laneCode
        - number
        - queueStatus
        - createdAt
      properties:
        visitId:
          type: string
          description: Internal unique visit id.
          example: '20260530-A-001'
        laneCode:
          type: string
          example: 'A'
        number:
          type: integer
          example: 1
        queueStatus:
          $ref: './common.yaml#/components/schemas/QueueStatus'
        createdAt:
          type: string
          format: date-time
        destinationRoomLabel:
          type: string
          nullable: true
          description: Patient-facing hint from the visit's operative routing or journey target.
    TerminalTopic:
      type: object
      required:
        - registrationBlocked
        - topicId
        - label
        - sortOrder
        - iconId
        - accentColor
        - availableFrom
        - availableTo
      properties:
        registrationBlocked:
          type: boolean
          description: Host registration policy blocks this lane for the current practice day.
        topicId:
          type: string
        label:
          type: string
        sortOrder:
          type: integer
        iconId:
          type: string
          nullable: true
        accentColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Badge color for lane letter and terminal tile accent.
        availableFrom:
          type: string
          nullable: true
        availableTo:
          type: string
          nullable: true
paths:
  /api/v1/checkins/topics:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    get:
      summary: List enabled terminal topics for check-in UI
      responses:
        '200':
          description: Terminal topic catalog
          content:
            application/json:
              schema:
                type: object
                required:
                  - topics
                  - receptionRegistrationBlocked
                properties:
                  receptionRegistrationBlocked:
                    type: boolean
                    description: Registration policy blocks the reserved reception/assistance lane.
                  topics:
                    type: array
                    items:
                      $ref: '#/components/schemas/TerminalTopic'
  /api/v1/checkins:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Create check-in visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - topicId
                - authPath
              properties:
                topicId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
                  description: Configured terminal topic id from ops settings.
                authPath:
                  type: string
                  enum:
                    - phone_dob
                    - name_dob
                    - egk
                    - none
                identityRef:
                  type: string
                phoneNumber:
                  type: string
                  description: Optional phone number for CSV identity lookup; stored on the visit when authPath is phone_dob (portal anamnese prefill).
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Last name for CSV identity lookup when authPath is name_dob (case-insensitive exact match on the CSV lastName column).
                birthDate:
                  type: string
                  minLength: 8
                  maxLength: 32
                  description: Birth date for CSV identity lookup when authPath is phone_dob (optional) or name_dob (required), e.g. DD.MM.YYYY or YYYY-MM-DD.
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitCreated'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Check-in rejected by configured opening-hour guardrails
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              examples:
                checkinClosed:
                  summary: Practice currently closed
                  value:
                    code: CHECKIN_CLOSED
                    message: Check-in ist ausserhalb der Praxiszeiten nicht verfuegbar.
                topicDisabled:
                  summary: Topic currently disabled (e.g. open consultation / offen)
                  value:
                    code: TOPIC_DISABLED
                    message: Thema ist derzeit deaktiviert.
                topicClosed:
                  summary: Topic currently outside configured topic window
                  value:
                    code: TOPIC_CLOSED
                    message: Thema ist aktuell ausserhalb des konfigurierten Zeitfensters.
                checkinLocked:
                  summary: Check-in locked by MFA/ops
                  value:
                    code: CHECKIN_LOCKED
                    message: Check-in ist derzeit gesperrt.
        '500':
          description: Invalid opening-hour configuration
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              examples:
                opsSettingsInvalid:
                  summary: Invalid practice-hour settings
                  value:
                    code: OPS_SETTINGS_INVALID
                    message: Praxiszeiten sind ungueltig konfiguriert.
  /api/v1/checkins/assistance:
    parameters:
      - $ref: './common.yaml#/components/parameters/XClientRole'
    post:
      summary: Create an assistance visit for pickup at the terminal
      responses:
        '201':
          description: Assistance ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitCreated'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: Check-in rejected by practice guardrails
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '500':
          description: Invalid practice configuration
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
