# Optional overlay: guest WLAN gateway (openNDS + dnsmasq).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gateway.yml --profile gateway up -d --build
#
# Requires Linux host, NET_ADMIN, and a real guest-LAN interface (GATEWAY_INTERFACE).

x-docker-logging: &docker-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

services:
  app:
    environment:
      GATEWAY_AUTH_BRIDGE_URL: ${GATEWAY_AUTH_BRIDGE_URL:?GATEWAY_AUTH_BRIDGE_URL is required}

  gateway:
    logging: *docker-logging
    image: praxis-flow/gateway:local
    build:
      context: .
      dockerfile: gateway/Dockerfile
      sbom: true
      provenance: mode=max
    container_name: praxis-flow-gateway
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    profiles:
      - gateway
    environment:
      GATEWAY_INTERFACE: ${GATEWAY_INTERFACE:-eth0}
      GATEWAY_IP: ${GATEWAY_IP:-192.168.88.1}
      GATEWAY_DHCP_RANGE_START: ${GATEWAY_DHCP_RANGE_START:-192.168.88.50}
      GATEWAY_DHCP_RANGE_END: ${GATEWAY_DHCP_RANGE_END:-192.168.88.250}
      APP_PORTAL_URL: ${APP_PORTAL_URL:-http://127.0.0.1:8080/portal}
      APP_API_URL: ${APP_API_URL:-http://127.0.0.1:8080}
      APP_PORTAL_MENU_URL: ${APP_PORTAL_MENU_URL:-http://127.0.0.1:8080/portal/menu}
      PORTAL_FQDN: ${PORTAL_FQDN:-portal.praxis.local}
      OPENNDS_FAS_KEY: ${OPENNDS_FAS_KEY:-change-me-opennds-fas-key}
      AUTH_KEY_CAPTIVE: ${AUTH_KEY_CAPTIVE:?AUTH_KEY_CAPTIVE is required}
      GATEWAY_AUTH_BRIDGE_PORT: ${GATEWAY_AUTH_BRIDGE_PORT:-9100}
      GATEWAY_AUTH_BRIDGE_BIND: ${GATEWAY_AUTH_BRIDGE_BIND:?GATEWAY_AUTH_BRIDGE_BIND is required}
    depends_on:
      app:
        condition: service_healthy
