# Container logs: stdout → json-file driver with rotation (see docs/operations/runtime.md).
name: wartezimmer

x-docker-logging: &docker-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

services:
  app:
    logging: *docker-logging
    image: wartezimmer/app:local
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        VITE_API_BASE: ''
      sbom: true
      provenance: mode=max
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Container images omit swagger/devDeps; docs are for host `npm run dev:app` (or explicit true + rebuild with deps).
      OPENAPI_DOCS_ENABLED: ${OPENAPI_DOCS_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      HOST: 0.0.0.0
      PORT: 8080
      MAINTENANCE_HOST: 0.0.0.0
      MAINTENANCE_PORT: 8082
      # Local-dev fallback; delivery requires a generated per-installation secret.
      MAINTENANCE_TOKEN: ${MAINTENANCE_TOKEN:-wartezimmer-local-dev-maintenance-token}
      EXPORT_BASE_PATH: ${EXPORT_BASE_PATH:-/exports}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_KEY_CAPTIVE: ${AUTH_KEY_CAPTIVE:?AUTH_KEY_CAPTIVE is required}
      STAFF_SESSION_TTL_MS: ${STAFF_SESSION_TTL_MS:-43200000}
      STAFF_SESSION_IDLE_TTL_MS: ${STAFF_SESSION_IDLE_TTL_MS:-7200000}
      SANDBOX_INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:?SANDBOX_INTERNAL_TOKEN is required}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-http://sandbox:8081}
      SANDBOX_DOCS_BASE_PATH: ${SANDBOX_DOCS_BASE_PATH:-/var/lib/wartezimmer/docs}
      CONTACT_LOOKUP_BASE_PATH: ${CONTACT_LOOKUP_BASE_PATH:-/imports}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TRUST_PROXY_HOST: ${TRUST_PROXY_HOST:-proxy}
      PRACTICE_DISPLAY_NAME: ${PRACTICE_DISPLAY_NAME:-}
      PRACTICE_ADDRESS: ${PRACTICE_ADDRESS:-}
      PRACTICE_POSTAL_CODE: ${PRACTICE_POSTAL_CODE:-}
      PRACTICE_CITY: ${PRACTICE_CITY:-}
      PRACTICE_PHONE: ${PRACTICE_PHONE:-}
      PRACTICE_EMAIL: ${PRACTICE_EMAIL:-}
      PRACTICE_DPO: ${PRACTICE_DPO:-}
      PRACTICE_WEBSITE: ${PRACTICE_WEBSITE:-}
    ports:
      - '${APP_BIND_ADDRESS:-0.0.0.0}:8080:8080'
      # LAN boundary: publish maintenance only on host loopback (container listens 0.0.0.0:8082).
      - '127.0.0.1:8082:8082'
    volumes:
      - app_data:/var/lib/wartezimmer/app
      - ${EXPORTS_HOST_PATH:-~/wartezimmer-exports}:/exports
      - ${IMPORTS_HOST_PATH:-~/wartezimmer-imports}:/imports
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          '-T',
          '4',
          '--header=Connection: close',
          'http://127.0.0.1:8080/api/v1/ops/health',
        ]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 5

  sandbox:
    logging: *docker-logging
    image: wartezimmer/sandbox:local
    build:
      context: .
      dockerfile: sandbox/Dockerfile
      sbom: true
      provenance: mode=max
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      SANDBOX_AUTH_ENABLED: ${SANDBOX_AUTH_ENABLED:-true}
      SANDBOX_INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:?SANDBOX_INTERNAL_TOKEN is required}
      SANDBOX_SCAN_ENABLED: ${SANDBOX_SCAN_ENABLED:-true}
      SANDBOX_SCAN_TIMEOUT_MS: ${SANDBOX_SCAN_TIMEOUT_MS:-20000}
      CLAMAV_DB_PATH: ${CLAMAV_DB_PATH:-/var/lib/clamav}
      CLAMAV_MAX_SIGNATURE_AGE_HOURS: ${CLAMAV_MAX_SIGNATURE_AGE_HOURS:-48}
      CLAMAV_AUTO_UPDATE_ON_START: ${CLAMAV_AUTO_UPDATE_ON_START:-true}
    expose:
      - '8081'
    volumes:
      - clamav_db:/var/lib/clamav
    read_only: true
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /var/lib/wartezimmer/sandbox-intake:size=${SANDBOX_INTAKE_TMPFS_SIZE:-256m},mode=0700
      - /tmp:size=64m,mode=1777
      - /var/log/clamav:size=8m,mode=1777
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          '-T',
          '4',
          '--header=Connection: close',
          'http://127.0.0.1:8081/internal/health/live',
        ]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 5

volumes:
  app_data:
  clamav_db:
