x-docker-logging: &docker-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

services:
  app:
    logging: *docker-logging
    image: ${PRAXIS_FLOW_APP_IMAGE:?PRAXIS_FLOW_APP_IMAGE is required}
    # Images come from a verified release package (docker load); never pull from a registry.
    pull_policy: never
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      MAINTENANCE_HOST: 0.0.0.0
      MAINTENANCE_PORT: 8082
      MAINTENANCE_TOKEN: ${MAINTENANCE_TOKEN:?MAINTENANCE_TOKEN is required}
      EXPORT_BASE_PATH: ${EXPORT_BASE_PATH:-/exports}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_KEY_CAPTIVE: ${AUTH_KEY_CAPTIVE:?AUTH_KEY_CAPTIVE is required}
      STAFF_SESSION_TTL_MS: ${STAFF_SESSION_TTL_MS:-43200000}
      STAFF_SESSION_IDLE_TTL_MS: ${STAFF_SESSION_IDLE_TTL_MS:-7200000}
      SANDBOX_INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:?SANDBOX_INTERNAL_TOKEN is required}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-http://sandbox:8081}
      SANDBOX_DOCS_BASE_PATH: ${SANDBOX_DOCS_BASE_PATH:-/var/lib/praxis-flow/docs}
      CONTACT_LOOKUP_BASE_PATH: ${CONTACT_LOOKUP_BASE_PATH:-/imports}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - '${APP_BIND_ADDRESS:-0.0.0.0}:8080:8080'
      # LAN boundary: publish maintenance only on host loopback (container listens 0.0.0.0:8082).
      - '127.0.0.1:8082:8082'
    volumes:
      - app_data:/var/lib/praxis-flow/app
      - ${EXPORTS_HOST_PATH:-~/praxis-flow-exports}:/exports
      - ${IMPORTS_HOST_PATH:-~/praxis-flow-imports}:/imports
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/api/v1/ops/health']
      interval: 10s
      timeout: 3s
      retries: 5

  sandbox:
    logging: *docker-logging
    image: ${PRAXIS_FLOW_SANDBOX_IMAGE:?PRAXIS_FLOW_SANDBOX_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      SANDBOX_AUTH_ENABLED: ${SANDBOX_AUTH_ENABLED:-true}
      SANDBOX_INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:?SANDBOX_INTERNAL_TOKEN is required}
      SANDBOX_SCAN_ENABLED: ${SANDBOX_SCAN_ENABLED:-true}
      SANDBOX_SCAN_TIMEOUT_MS: ${SANDBOX_SCAN_TIMEOUT_MS:-15000}
      CLAMAV_DB_PATH: ${CLAMAV_DB_PATH:-/var/lib/clamav}
      CLAMAV_MAX_SIGNATURE_AGE_HOURS: ${CLAMAV_MAX_SIGNATURE_AGE_HOURS:-48}
      CLAMAV_AUTO_UPDATE_ON_START: ${CLAMAV_AUTO_UPDATE_ON_START:-true}
    expose:
      - '8081'
    volumes:
      - clamav_db:/var/lib/clamav
    read_only: true
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /var/lib/praxis-flow/sandbox-intake:size=${SANDBOX_INTAKE_TMPFS_SIZE:-256m},mode=0700
      - /tmp:size=64m,mode=1777
      - /var/log/clamav:size=8m,mode=1777
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8081/internal/health/live']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app_data:
  clamav_db:
