# Optional overlay: HTTP reverse proxy on port 80 (stock Caddy).
# Usage (dev):
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# HTTP base. LAN-TLS adds docker-compose.proxy-tls.yml only while TLS is prepared/active.

x-docker-logging: &docker-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

services:
  proxy:
    logging: *docker-logging
    image: ${PRAXIS_FLOW_PROXY_IMAGE:-caddy:2.11.4}
    container_name: praxis-flow-proxy
    restart: unless-stopped
    ports:
      - '${PROXY_HTTP_PORT:-80}:80'
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Hits Caddy :80 (reverse_proxy → app). App is already service_healthy via depends_on.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 10s
      timeout: 3s
      retries: 5
