# Optional overlay: HTTP reverse proxy on port 80 (stock Caddy).
# Usage (dev):
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# HTTP base. LAN-TLS adds docker-compose.proxy-tls.yml only while TLS is prepared/active.

x-docker-logging: &docker-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

services:
  app:
    # A proxy-enabled stack must never retain the open demo publish from the base file.
    ports: !override
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:8082:8082'

  proxy:
    logging: *docker-logging
    image: ${WARTEZIMMER_PROXY_IMAGE:-caddy:2.11.7}
    restart: unless-stopped
    # Reap orphaned BusyBox ssl_client children from HTTPS healthchecks.
    init: true
    security_opt: ['no-new-privileges:true']
    environment:
      PROXY_MODE: ${PROXY_MODE:-http}
      PROXY_HTTP_PORT: ${PROXY_HTTP_PORT:-80}
      PROXY_HTTPS_PORT: ${PROXY_HTTPS_PORT:-443}
    ports:
      - '${SETUP_LAN_APP_IP:?SETUP_LAN_APP_IP is required}:${PROXY_HTTP_PORT:-80}:80'
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Use internal loopback probe: checks port 443 first (healthy if TLS mode is active),
      # falls back to port 80 (healthy if HTTP-only mode is active).
      test:
        - CMD-SHELL
        - |
          wget -qO- -T 2 --header='Connection: close' --no-check-certificate "https://127.0.0.1:443/__wartezimmer/health" >/dev/null 2>&1 || wget -qO- -T 2 --header='Connection: close' "http://127.0.0.1:80/" >/dev/null 2>&1
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 5
